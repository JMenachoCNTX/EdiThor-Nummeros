<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<!-- PAGINA -->
<title>Editor de Marca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
@font-face{font-family:"Akshar";font-weight:600;font-display:swap;src:url(fonts/Akshar-600.woff2) format("woff2")}
@font-face{font-family:"Akshar";font-weight:700;font-display:swap;src:url(fonts/Akshar-700.woff2) format("woff2")}
@font-face{font-family:"Questrial";font-weight:400;font-display:swap;src:url(fonts/Questrial-400.woff2) format("woff2")}
@font-face{font-family:"Adventor CX";font-weight:400;font-display:swap;src:url(fonts/Adventor-400.woff2) format("woff2")}
@font-face{font-family:"Adventor CX";font-weight:700;font-display:swap;src:url(fonts/Adventor-700.woff2) format("woff2")}
/* Layout: one-screen tool. Header bar, then four columns: icon rail · library · canvas stage · properties. On phones the stage comes first and the panels stack below it. The accent follows the brand being edited (green for NUMMEROS, navy for CONTAX). */
:root{
  --bg:#EDF0EF; --panel:#FFFFFF; --line:#DCE2E0; --ink:#172022; --muted:#5A6668; --field:#F1F4F3; --stage:#E2E7E5; --hover:#E8EDEB;
  --acc-n:#235347; --acc-c:#152644; --on-acc:#FFFFFF; --danger:#B42318; --ok:#2E7D5B;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --head:"Akshar","Arial Narrow",sans-serif;
  --r:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1213; --panel:#161B1D; --line:#273033; --ink:#E5EBEA; --muted:#93A0A2; --field:#1E2628; --stage:#0A0D0E; --hover:#212A2C;
  --acc-n:#8EB69B; --acc-c:#C9D2D5; --on-acc:#0B1214; --danger:#F97066; --ok:#6FCF9F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1213; --panel:#161B1D; --line:#273033; --ink:#E5EBEA; --muted:#93A0A2; --field:#1E2628; --stage:#0A0D0E; --hover:#212A2C;
  --acc-n:#8EB69B; --acc-c:#C9D2D5; --on-acc:#0B1214; --danger:#F97066; --ok:#6FCF9F; color-scheme:dark}
:root[data-marca="nummeros"]{--acc:var(--acc-n)}
:root[data-marca="contax"]{--acc:var(--acc-c)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brandmark{display:flex;align-items:center;gap:8px;font:700 17px/1 var(--head);letter-spacing:.02em;white-space:nowrap}
.brandmark svg{width:18px;height:24px;flex:none}
.brandmark small{display:block;font:600 10px/1.2 var(--head);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font:600 13px var(--head);letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
#nombre{min-width:0;flex:0 1 220px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:600}
#nombre:hover,#nombre:focus{border-color:var(--line);background:var(--field)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 10px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.icon{padding:6px;width:32px;height:32px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{color:var(--danger)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:30;min-width:200px;display:grid;gap:2px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--muted);font-size:11.5px}

/* main grid */
.main{display:grid;grid-template-columns:68px 300px minmax(0,1fr) 290px;min-height:0}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;padding-left:max(6px,env(safe-area-inset-left,0px))}
.rail button{border:0;background:transparent;border-radius:8px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted)}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--field);color:var(--acc);font-weight:600}
.rail .only-mobile{display:none}
.lib,.props{background:var(--panel);overflow:auto;min-height:0}
.lib{border-right:1px solid var(--line)}
.props{border-left:1px solid var(--line)}
.pane{padding:14px 14px 28px}
.pane h2{font:700 20px/1.1 var(--head);margin:0 0 4px;letter-spacing:.01em}
.pane h3{font:600 12px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.pane p.hint{color:var(--muted);margin:0 0 10px;font-size:12.5px}

/* library grids */
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thumbs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.thumb{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0}
.thumb:hover{border-color:var(--acc)}
.thumb .pic{display:grid;place-items:center;aspect-ratio:1;background:var(--stage);overflow:hidden;max-width:100%}
.thumb .pic.dark{background:#0E1A1C}
.thumb .pic img,.thumb .pic canvas{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pic.contain img{object-fit:contain;padding:10px}
.thumb .pic canvas{object-fit:contain}
.thumb span{padding:6px 8px;font-size:11.5px;line-height:1.25;color:var(--ink)}
.thumb span small{display:block;color:var(--muted);font-size:10.5px}
.addlist{display:grid;gap:6px}
.addlist button{border:1px solid var(--line);background:var(--field);border-radius:8px;text-align:left;padding:10px 12px}
.addlist button:hover{border-color:var(--acc)}
.addlist .a1{font:700 24px/1 var(--head)}
.addlist .a2{font:600 17px/1.1 var(--head)}
.addlist .a3{font-size:14px}
.addlist .a4{font:600 12px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.addlist .a5{display:inline-block;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:4px 12px;font:600 13px var(--head)}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shapes button{border:1px solid var(--line);background:var(--field);border-radius:8px;aspect-ratio:1;display:grid;place-items:center;gap:2px;padding:6px;font-size:11px;color:var(--muted)}
.shapes button:hover{border-color:var(--acc)}
.shapes svg{width:42px;height:42px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--acc);background:var(--field)}
.toggle2{display:flex;gap:6px;margin-bottom:10px}
.toggle2 button{flex:1;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px;font-weight:600}
.toggle2 button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}

/* stage */
.stage{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stagebar{position:absolute;right:12px;bottom:12px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.stagebar .btn{border:0;height:28px;padding:4px 8px}
.stagebar output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.sizetag{position:absolute;left:12px;bottom:12px;font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
#editor-txt{position:absolute;margin:0;border:0;outline:1.5px dashed #2E90FA;background:transparent;resize:none;overflow:hidden;white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;z-index:5;padding:0}
.dropveil{position:absolute;inset:0;background:rgba(46,144,250,.12);border:2px dashed #2E90FA;display:grid;place-items:center;font-weight:700;font-size:15px;color:#2E90FA;z-index:6}

/* properties */
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row.one{grid-template-columns:1fr}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:11.5px;color:var(--muted)}
.f input[type=number],.f input[type=text],.f select,.f textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.f textarea{min-height:84px;resize:vertical;line-height:1.4}
.f input[type=range]{width:100%;accent-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:6px;border:1px solid rgba(127,127,127,.45);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--acc);outline-offset:2px}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--panel)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#f44,#fd4,#4d6,#4cf,#46f,#d4f,#f44)}
.sw.custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer;width:40px;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 8px;font-size:12px;min-width:32px}
.chips button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chips svg{width:16px;height:16px;display:block}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.check input{accent-color:var(--acc);width:16px;height:16px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.layers{display:grid;gap:2px}
.layer{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer;min-width:0}
.layer:hover{background:var(--hover)}
.layer.on{border-color:var(--acc);background:var(--field)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.layer .kind{font-size:10.5px;color:var(--muted);width:44px;flex:none}
.layer button{border:0;background:transparent;padding:2px;border-radius:4px;color:var(--muted);display:grid}
.layer button:hover{color:var(--ink);background:var(--hover)}
.layer button svg{width:15px;height:15px}
.layer.off .nm{opacity:.45}

/* overlays */
.veil{position:fixed;inset:0;background:rgba(5,10,12,.5);z-index:40;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.dlg header h2{font:700 22px/1 var(--head);margin:0;flex:1}
.dlg .body{padding:16px;overflow:auto;min-height:0}
.designs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.dcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--field);display:flex;flex-direction:column;min-width:0}
.dcard .pic{aspect-ratio:1;background:var(--stage);display:grid;place-items:center;border:0;padding:0;cursor:pointer;max-width:100%}
.dcard .pic img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.dcard .meta{padding:8px 10px;display:grid;gap:2px;min-width:0}
.dcard .meta b{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .meta small{color:var(--muted);font-size:11px}
.dcard .acts{display:flex;gap:4px;padding:0 8px 8px;flex-wrap:wrap}
.dcard .acts button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:3px 8px;font-size:11.5px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.preview-img{max-width:100%;max-height:60vh;display:block;margin:0 auto;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}

/* IA tab */
.keyrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--line);background:var(--field)}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--danger)}
.pill.on i{background:var(--ok)}
.step{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font:600 12px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.step b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--acc);color:var(--on-acc);font-size:11px;letter-spacing:0}
.f textarea.tall{min-height:150px}
.selimg{display:flex;align-items:center;gap:10px;border:1px dashed var(--line);border-radius:8px;padding:8px;margin-bottom:8px;min-height:56px}
.selimg img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none;background:var(--stage)}
.selimg span{min-width:0;font-size:12.5px}.selimg small{display:block;color:var(--muted);font-size:11.5px}
.selimg .empty-sel{color:var(--muted)}
.btn.wide{width:100%;margin-top:8px;white-space:normal}
.progress{font-size:12.5px;color:var(--muted);margin-top:8px;min-height:18px}
.progress.err{color:var(--danger)}
.note{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:12px;font-size:12.5px;color:var(--ink)}
.note a{color:var(--acc);font-weight:600}
.dlg .f{margin-bottom:12px}
.dlg .f input,.dlg .f select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.dlg small.k{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.dlg .row-end{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:6px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

/* phones and narrow windows */
@media (max-width:900px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .top{flex-wrap:wrap}
  #nombre{order:5;flex:1 1 100%}
  .status{display:none}
  .hide-narrow{display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage{height:58vh;order:1;border-bottom:1px solid var(--line)}
  .rail{order:2;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .rail button{min-width:62px}
  .rail .only-mobile{display:grid}
  .lib,.props{order:3;border:0;overflow:visible}
  .main[data-tab="editar"] .lib{display:none}
  .main:not([data-tab="editar"]) .props{display:none}
  .pane{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brandmark" title="NUMMEROS by CONTAX">
      <svg viewBox="0 0 546 728" aria-hidden="true"><path fill="currentColor" style="color:var(--acc)" d="M0 427 L0 728 L136 728 L136 634 Z M410 0 L410 85 L546 292 L546 0 Z M0 0 L148 0 L410 458.5 L410 341 L546 548 L546 728 L401.71 728 L136 263 L136 379 L0 172 Z"/></svg>
      <div>Editor de Marca<small>NUMMEROS by CONTAX</small></div>
    </div>
    <div class="seg" role="group" aria-label="Marca">
      <button type="button" id="m-nummeros" data-marca="nummeros">NUMMEROS</button>
      <button type="button" id="m-contax" data-marca="contax">CONTAX</button>
    </div>
    <input id="nombre" type="text" aria-label="Nombre del diseño" value="Diseño sin nombre">
    <div class="spacer"></div>
    <span class="status" id="status" aria-live="polite"></span>
    <button class="btn icon" id="undo" type="button" title="Deshacer (Ctrl/⌘ + Z)" aria-label="Deshacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="btn icon" id="redo" type="button" title="Rehacer (Ctrl/⌘ + Shift + Z)" aria-label="Rehacer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <button class="btn" id="btn-disenos" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="hide-narrow">Mis diseños</span></button>
    <div class="menuwrap">
      <button class="btn pri" id="btn-descargar" type="button" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Descargar</button>
      <div class="menu" id="menu-descargar" hidden>
        <button type="button" data-fmt="png">PNG<small>Máxima calidad · para redes y estados</small></button>
        <button type="button" data-fmt="jpg">JPG<small>Archivo más liviano · para WhatsApp</small></button>
      </div>
    </div>
  </header>

  <div class="main" id="main" data-tab="plantillas">
    <nav class="rail" role="tablist" aria-label="Herramientas">

/* keep an image for later: cloud asset, browser database, or (last resort) inline */
async function keepImage(blob){

/* ================== text layout ================== */
const MC=document.createElement("canvas").getContext("2d");
const HAS_LS="letterSpacing" in MC;
function fontStr(L,s){const f=FONTS[L.font]||FONTS.Questrial;return `${L.weight||400} ${s??L.size}px ${f.css}`}
function setFont(ctx,L){ctx.font=fontStr(L);if(HAS_LS)ctx.letterSpacing=((L.ls||0)*L.size)+"px"}
function layoutText(L){
  setFont(MC,L);
  const raw=L.upper?String(L.txt).toUpperCase():String(L.txt);
  const px=L.px||0,py=L.py||0;
  const maxW=L.autoW?Infinity:Math.max(10,L.w-px*2);
  const lines=[];
  for(const para of raw.split("\n")){
    const words=para.split(/ +/);let line="";
    if(!para){lines.push("");continue}
    for(const w of words){const test=line?line+" "+w:w;if(line&&MC.measureText(test).width>maxW){lines.push(line);line=w}else line=test}
    lines.push(line);
  }
  const widths=lines.map(l=>MC.measureText(l).width);
  if(L.autoW)L.w=Math.ceil(Math.max(10,...widths)+px*2);
  L.h=Math.ceil(lines.length*L.size*(L.lh||1.2)+py*2);
  L._lines=lines;L._widths=widths;
}

/* ================== drawing ================== */
function rr(ctx,x,y,w,h,r){r=Math.max(0,Math.min(r||0,w/2,h/2));ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}}
function drawLayer(ctx,L,editingId){
  if(L.hide)return;
  ctx.save();ctx.globalAlpha=L.op??1;
  const {x,y,w,h}=L;
  if(L.t==="rect"){rr(ctx,x,y,w,h,L.rad);if(L.fill){ctx.fillStyle=L.fill;ctx.fill()}if(L.sw>0&&L.stroke){ctx.lineWidth=L.sw;ctx.strokeStyle=L.stroke;ctx.stroke()}}
  else if(L.t==="ellipse"){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);if(L.fill){ctx.fillStyle=L.fill;ctx.fill()}if(L.sw>0&&L.stroke){ctx.lineWidth=L.sw;ctx.strokeStyle=L.stroke;ctx.stroke()}}
  else if(L.t==="img"){
    const r=img(L.src);
    if(L.rad){rr(ctx,x,y,w,h,L.rad);ctx.clip()}else{ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip()}
    if(r.ok){const iw=r.im.naturalWidth,ih=r.im.naturalHeight;const s=L.fit==="contain"?Math.min(w/iw,h/ih):Math.max(w/iw,h/ih)*(L.z||1);const dw=iw*s,dh=ih*s;ctx.drawImage(r.im,x+(w-dw)*(L.fx??.5),y+(h-dh)*(L.fy??.5),dw,dh)}
    else{ctx.fillStyle=r.err?"rgba(180,35,24,.15)":"rgba(127,127,127,.18)";ctx.fillRect(x,y,w,h)}
  }
  else if(L.t==="n"){ctx.translate(x,y);ctx.scale(w/546,h/728);ctx.fillStyle=L.fill;ctx.fill(P2D.n)}
  else if(L.t==="iso"){ctx.translate(x,y);ctx.scale(w/ISO.w,h/ISO.h);ctx.fillStyle=L.fill2;ctx.fill(P2D.gris);ctx.fillStyle=L.fill3;ctx.fill(P2D.negro);ctx.fillStyle=L.fill;ctx.fill(P2D.azul)}
  else if(L.t==="text"){
    layoutText(L);
    if(L.bg){rr(ctx,x,y,L.w,L.h,L.rad);ctx.fillStyle=L.bg;ctx.fill()}
    if(L.id!==editingId){
      setFont(ctx,L);ctx.fillStyle=L.color;ctx.textBaseline="alphabetic";
      const lh=L.size*(L.lh||1.2),px=L.px||0,py=L.py||0,inner=L.w-px*2;
      L._lines.forEach((ln,i)=>{const lw=L._widths[i];let tx=x+px;if(L.align==="center")tx=x+px+(inner-lw)/2;else if(L.align==="right")tx=x+px+inner-lw;
        const base=y+py+i*lh+(lh-L.size)/2+L.size*.8;ctx.fillText(ln,tx,base)});
    }
  }
  ctx.restore();
}

}

const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open("editor-marca",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("abort"))})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
const store={kind:"local",db:null,uid:null,assets:null,downloads:null,idb:false,
  col(){return this.db.collection("data/users/"+this.uid)},
  async list(){if(this.kind==="db"){const q=await this.col().get();return q.docs.filter(s=>s.id.startsWith("d-")).map(s=>Object.assign({id:s.id},s.data()))}
    if(this.idb)return(await IDB.get("index"))||[];
    return lsGet("ed.designs",[])},
  async get(id){if(this.kind==="db"){const s=await this.col().doc(id).get();return s.exists?Object.assign({id},s.data()):null}
    if(this.idb){const d=await IDB.get("d:"+id);return d?Object.assign({id},d):null}
    return lsGet("ed.designs",[]).find(x=>x.id===id)||null},
  async put(d){const rec={name:d.name,brand:d.brand,w:d.w,h:d.h,bg:d.bg,layers:d.layers,thumb:d.thumb||"",updated:Date.now()};
    if(this.kind==="db"){await this.col().doc(d.id).set(rec);return}
    if(this.idb){await IDB.set("d:"+d.id,rec);const idx=((await IDB.get("index"))||[]).filter(x=>x.id!==d.id);idx.unshift({id:d.id,name:rec.name,brand:rec.brand,w:rec.w,h:rec.h,thumb:rec.thumb,updated:rec.updated});await IDB.set("index",idx);return}
    const all=lsGet("ed.designs",[]).filter(x=>x.id!==d.id);all.unshift(Object.assign({id:d.id},rec));localStorage.setItem("ed.designs",JSON.stringify(all.slice(0,30)))},
  async del(id){if(this.kind==="db"){await this.col().doc(id).delete();return}
    if(this.idb){await IDB.del("d:"+id);await IDB.set("index",((await IDB.get("index"))||[]).filter(x=>x.id!==id));return}
    lsSet("ed.designs",lsGet("ed.designs",[]).filter(x=>x.id!==id))},
  async uploads(){if(this.kind==="db"){const s=await this.col().doc("subidas").get();return s.exists?(s.data().items||[]):[]}
    if(this.idb)return(await IDB.get("uploads"))||[];return lsGet("ed.uploads",[])},
  async setUploads(items){if(this.kind==="db"){await this.col().doc("subidas").set({items:items.filter(i=>!i.src.startsWith("data:"))});return}
    if(this.idb){await IDB.set("uploads",items);return}lsSet("ed.uploads",items.filter(i=>!i.src.startsWith("data:")))}
};
async function initLocal(){
  try{await IDB.open();store.idb=true;
    if(!(await IDB.get("index"))){const old=lsGet("ed.designs",[]);for(const d of old.slice().reverse()){await store.put(d)}await IDB.set("index",(await IDB.get("index"))||[])}
  }catch(e){store.idb=false}
}
async function initStore(){
  const c=window.claude;if(!c||!c.use){await initLocal();refreshUploads();return}
  try{
    const [db,user,assets,downloads]=await Promise.all(["db","user","assets","downloads"].map(n=>c.use(n).catch(()=>null)));
    store.assets=assets;store.downloads=downloads;
    const id=user?await user.id():null;
    if(db&&id){store.db=db;store.uid=id;store.kind="db"}
  }catch(e){}
  if(store.kind!=="db")await initLocal();
  refreshUploads();
}

/* ================== history & autosave ================== */
function snapshot(){const d=S.doc;return JSON.stringify({name:d.name,w:d.w,h:d.h,bg:d.bg,brand:d.brand,layers:d.layers.map(stripL)})}
function stripL(L){const o={};for(const k in L)if(k[0]!=="_")o[k]=L[k];return o}
function resetHistory(){S.hist=[snapshot()];S.hi=0;updUndo()}
function commit(){const s=snapshot();if(s===S.hist[S.hi])return;S.hist=S.hist.slice(0,S.hi+1);S.hist.push(s);if(S.hist.length>80)S.hist.shift();S.hi=S.hist.length-1;updUndo();S.ver=(S.ver||0)+1;S.dirty=true;scheduleSave()}
function restore(s){const o=JSON.parse(s);Object.assign(S.doc,o);if(!S.doc.layers.find(l=>l.id===S.sel))S.sel=null;S.multi=S.multi.filter(id=>S.doc.layers.some(l=>l.id===id));if(S.multi.length<2)S.multi=[];S.crop=null;$("#nombre").value=S.doc.name;S.ver=(S.ver||0)+1;S.dirty=true;renderProps();requestRender();scheduleSave()}
function undo(){if(S.hi>0){S.hi--;restore(S.hist[S.hi]);updUndo()}}
function redo(){if(S.hi<S.hist.length-1){S.hi++;restore(S.hist[S.hi]);updUndo()}}
function updUndo(){$("#undo").disabled=S.hi<=0;$("#redo").disabled=S.hi>=S.hist.length-1}
function setStatus(t,err){const el=$("#status");el.textContent=t;el.classList.toggle("err",!!err)}
function scheduleSave(){clearTimeout(S.saveTimer);setStatus("Cambios sin guardar");S.saveTimer=setTimeout(saveNow,1300)}
async function saveNow(){
  clearTimeout(S.saveTimer);if(!S.dirty)return;
  const d=S.doc,ver=S.ver,rec=Object.assign({},d,{layers:d.layers.map(stripL)});
  setStatus("Guardando…");
  try{rec.thumb=d.thumb=await makeThumb(rec,220);await store.put(rec);lsSet("ed.last",d.id);
    if(S.doc===d&&S.ver===ver){S.dirty=false;setStatus(store.kind==="db"?"Guardado":"Guardado en este navegador")}}
  catch(e){setStatus(e&&(e.code==="quota_exceeded"||e.name==="QuotaExceededError")?"No se pudo guardar: no queda espacio. Elimina diseños viejos.":"No se pudo guardar. Revisa tu conexión.",true)}
}
async function makeThumb(d,max){const s=max/Math.max(d.w,d.h);const c=document.createElement("canvas");c.width=Math.round(d.w*s);c.height=Math.round(d.h*s);const x=c.getContext("2d");x.scale(s,s);drawDesign(x,d);try{return c.toDataURL("image/jpeg",.72)}catch(e){return ""}}

const cv=$("#cv"),ctx=cv.getContext("2d"),stage=$("#stage");

/* inline text editing */

/* keyboard */
document.addEventListener("keydown",e=>{
  const tag=(e.target.tagName||"").toLowerCase();const typing=tag==="input"||tag==="textarea"||tag==="select"||e.target.isContentEditable;
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==="z"&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==="y"&&!typing){e.preventDefault();redo();return}
  if(mod&&e.key.toLowerCase()==="s"){e.preventDefault();S.dirty=true;saveNow();return}
  if(typing)return;
  if(S.crop&&(e.key==="Enter"||e.key==="Escape")){e.preventDefault();endCrop();return}
  if(mod&&e.key.toLowerCase()==="a"){e.preventDefault();setSel(S.doc.layers.filter(l=>!l.hide&&!l.lock).map(l=>l.id));return}
  const Ls=selLayers();if(!Ls.length)return;
  if(mod&&e.key.toLowerCase()==="g"){e.preventDefault();e.shiftKey?ungroupSel():groupSel();return}
  if(mod&&e.key.toLowerCase()==="d"){e.preventDefault();duplicate();return}
  if(e.key==="Delete"||e.key==="Backspace"){e.preventDefault();removeSel();return}
  if(e.key==="Escape"){setSel([]);return}
  const L=selL();
  if(e.key==="Enter"&&L&&L.t==="text"){e.preventDefault();startEdit(L.id);return}
  if(e.key==="Enter"&&L&&L.t==="img"){e.preventDefault();startCrop(L.id);return}
  const st=e.shiftKey?10:1;const mv={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st]}[e.key];
  if(mv){e.preventDefault();for(const x of Ls)if(!x.lock){x.x+=mv[0];x.y+=mv[1]}requestRender();syncGeom();clearTimeout(S.nudgeT);S.nudgeT=setTimeout(commit,400)}
});

/* ================== layer operations ================== */
function setSel(ids,primary){ids=[...new Set(ids)].filter(id=>S.doc.layers.some(l=>l.id===id));
  if(S.crop&&!(ids.length===1&&ids[0]===S.crop)){S.crop=null;commit()}
  if(ids.length<=1){S.multi=[];S.sel=ids[0]||null}else{S.multi=ids;S.sel=primary&&ids.includes(primary)?primary:ids[ids.length-1]}
  renderProps();requestRender();if(S.tab==="ia")iaSelUpdate()}
/* clicking an element selects its whole group */
function select(id){if(!id){setSel([]);return}const L=S.doc.layers.find(l=>l.id===id);if(!L)return;setSel(groupOf(L).map(l=>l.id),id)}
function addLayer(L,{center=true}={}){if(L.t==="text")layoutText(L);if(center){L.x=Math.round((S.doc.w-L.w)/2);L.y=Math.round((S.doc.h-L.h)/2)}S.doc.layers.push(L);S.multi=[];S.crop=null;S.sel=L.id;commit();renderProps();requestRender();if(isNarrow())setTab("editar")}
function removeSel(){const ids=new Set(selLayers().filter(l=>!l.lock).map(l=>l.id));if(!ids.size){toast("Lo seleccionado está bloqueado.");return}S.doc.layers=S.doc.layers.filter(l=>!ids.has(l.id));S.multi=[];S.sel=null;S.crop=null;commit();renderProps();requestRender()}
/* copies of layers with fresh ids; grouped copies get a new group of their own */
function cloneSet(Ls,off){const gmap={};return Ls.map(L=>{const c=clone(stripL(L));c.id=uid();c.x+=off;c.y+=off;c.lock=false;c.hide=false;if(c.g)c.g=gmap[c.g]||(gmap[c.g]="g"+uid());return c})}
function duplicate(){const Ls=selLayers();if(!Ls.length)return;const cs=cloneSet(Ls,30);const at=Math.max(...Ls.map(l=>S.doc.layers.indexOf(l)))+1;S.doc.layers.splice(at,0,...cs);
  S.multi=cs.length>1?cs.map(c=>c.id):[];S.sel=cs[cs.length-1].id;commit();renderProps();requestRender()}
function reorder(dir){const a=S.doc.layers,ids=new Set(selIds());if(!ids.size)return;
  if(ids.size>1||dir==="top"||dir==="bottom"){const moving=a.filter(l=>ids.has(l.id)),rest=a.filter(l=>!ids.has(l.id));
    if(dir==="top"||dir==="up")S.doc.layers=[...rest,...moving];else S.doc.layers=[...moving,...rest];commit();renderProps();requestRender();return}
  const i=a.findIndex(l=>ids.has(l.id));const L=a.splice(i,1)[0];let j=dir==="up"?i+1:i-1;j=clamp(j,0,a.length);a.splice(j,0,L);commit();renderProps();requestRender()}
function groupSel(){const Ls=selLayers();if(Ls.length<2){toast("Selecciona dos o más elementos para agruparlos.");return}const g="g"+uid();Ls.forEach(l=>l.g=g);
  const a=S.doc.layers,top=Math.max(...Ls.map(l=>a.indexOf(l))),rest=a.filter(l=>!Ls.includes(l));const at=rest.indexOf(a.slice(top+1).find(l=>!Ls.includes(l)));
  S.doc.layers=at<0?[...rest,...Ls]:[...rest.slice(0,at),...Ls,...rest.slice(at)];commit();renderProps();requestRender();toast("Agrupados: ahora se mueven juntos")}
function ungroupSel(){const Ls=selLayers().filter(l=>l.g);if(!Ls.length)return;Ls.forEach(l=>delete l.g);commit();renderProps();requestRender();toast("Desagrupados")}
function alignSel(how){const Ls=selLayers().filter(l=>!l.lock);if(!Ls.length)return;const one=Ls.length===1||(Ls.every(l=>l.g&&l.g===Ls[0].g)&&!isMulti());
  const b=Ls.length===1?{x:0,y:0,w:S.doc.w,h:S.doc.h}:bbox(Ls);
  for(const L of Ls){if(L.t==="text")layoutText(L);
    if(how==="left")L.x=b.x;if(how==="hcenter")L.x=Math.round(b.x+(b.w-L.w)/2);if(how==="right")L.x=Math.round(b.x+b.w-L.w);
    if(how==="top")L.y=b.y;if(how==="vcenter")L.y=Math.round(b.y+(b.h-L.h)/2);if(how==="bottom")L.y=Math.round(b.y+b.h-L.h)}
  commit();renderProps();requestRender()}
/* draw the selected elements into a single picture */
async function flattenSel(){const Ls=selLayers().filter(l=>!l.hide);if(Ls.length<2){toast("Selecciona dos o más elementos.");return}
  await Promise.all(Ls.filter(l=>l.t==="img").map(l=>ld(l.src)));await fontsReady;
  const b=bbox(Ls),k=Math.min(1,4000/Math.max(b.w,b.h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.w*k));c.height=Math.max(1,Math.round(b.h*k));
  const x=c.getContext("2d");x.scale(k,k);x.translate(-b.x,-b.y);for(const L of Ls)drawLayer(x,L,null);
  setStatus("Uniendo…");let src;try{const blob=await new Promise((res,rej)=>c.toBlob(v=>v?res(v):rej(),"image/png"));src=await keepImage(blob)}catch(e){toast("No se pudo unir en una imagen.");setStatus("");return}
  await ld(src);const a=S.doc.layers,at=Math.max(...Ls.map(l=>a.indexOf(l)));const N=I({name:"Imagen combinada",x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.w),h:Math.round(b.h),src,fit:"contain"});
  a.splice(at+1,0,N);const ids=new Set(Ls.map(l=>l.id));S.doc.layers=a.filter(l=>!ids.has(l.id));S.multi=[];S.sel=N.id;commit();renderProps();requestRender();setStatus("");toast("Unidos en una sola imagen · ⌘ + Z para deshacer")}
const isNarrow=()=>window.matchMedia("(max-width:900px)").matches;

async function addImage(src,o={}){
  const im=await ld(src);if(!im){toast("No se pudo abrir esa imagen.");return}
  const L=selL();
  if(L&&L.t==="img"&&!L.lock&&!o.forceNew){L.src=src;if(o.fit)L.fit=o.fit;L.fx=.5;L.fy=.5;commit();renderProps();requestRender();toast("Imagen reemplazada");return}
  const a=im.naturalHeight/im.naturalWidth,maxW=S.doc.w*.7,maxH=S.doc.h*.7;let w=maxW,h=w*a;if(h>maxH){h=maxH;w=h/a}
  addLayer(I({name:o.name||"Imagen",w:Math.round(w),h:Math.round(h),src,fit:o.fit||"cover"}));
}

$("#file").addEventListener("change",e=>{handleFiles(e.target.files);e.target.value=""});
async function handleFiles(files){
  const list=[...files].filter(f=>/^image\/(png|jpe?g|webp|gif)$/.test(f.type));if(!list.length){toast("Solo se pueden subir imágenes PNG, JPG, WEBP o GIF.");return}
  for(const f of list){
    let src;
    try{setStatus("Guardando imagen…");src=await keepImage(f)}catch(e){const m={too_large:"La imagen pesa más de 20 MB.",quota_or_state:"No queda espacio para más imágenes.",rate_limited:"Espera unos segundos y vuelve a intentar."}[e&&e.code];toast(m||"No se pudo guardar la imagen.");setStatus("");continue}
    UPS.unshift({src,name:f.name.replace(/\.[a-z0-9]+$/i,"").slice(0,40)||"Imagen",at:Date.now()});
    await addImage(src,{name:"Imagen subida",forceNew:true});
  }
  setStatus(S.dirty?"Cambios sin guardar":"");
  try{await store.setUploads(UPS.slice(0,200))}catch(e){}
  if(S.tab==="subir")paintUploads();
}
/* ---- copy / cut / paste of design elements ----
   The copied element is kept here and in this browser, so it can be pasted into another design.
   The system clipboard gets plain text (the text itself, or a short label) so pasting elsewhere stays readable. */
const CLIP_KEY="ed.clip";let CLIP=lsGet(CLIP_KEY,null);
const isTyping=e=>{const el=e.target||{};const t=(el.tagName||"").toLowerCase();return t==="input"||t==="textarea"||t==="select"||el.isContentEditable};
function copySel(cut){const Ls=selLayers();if(!Ls.length)return null;const L=Ls[0];
  const plain=Ls.length>1?(Ls.filter(l=>l.t==="text").map(l=>l.txt).join("\n")||`[${Ls.length} elementos]`):L.t==="text"?String(L.txt):`[${KIND[L.t]||"Elemento"} · ${L.name||""}]`;
  CLIP={layers:Ls.map(l=>clone(stripL(l))),plain,n:0,doc:S.doc.id};lsSet(CLIP_KEY,CLIP);if(cut){removeSel();toast("Cortado")}else toast("Copiado · pégalo con ⌘ + V");return plain}
function pasteClip(){const c=CLIP||lsGet(CLIP_KEY,null);if(!c||!c.layers||!c.layers.length){toast("No hay nada copiado todavía.");return}
  if(c.doc!==S.doc.id){c.doc=S.doc.id;c.n=0}c.n=(c.n||0)+1;
  const clash=c.layers.some(L=>S.doc.layers.some(x=>x.x===L.x&&x.y===L.y));const cs=cloneSet(c.layers,clash||c.n>1?c.n*30:0);
  const b=bbox(cs);if(b.x>S.doc.w-20||b.y>S.doc.h-20){const dx=Math.round((S.doc.w-b.w)/2-b.x),dy=Math.round((S.doc.h-b.h)/2-b.y);cs.forEach(L=>{L.x+=dx;L.y+=dy})}
  S.doc.layers.push(...cs);CLIP=c;lsSet(CLIP_KEY,c);S.crop=null;S.multi=cs.length>1?cs.map(l=>l.id):[];S.sel=cs[cs.length-1].id;commit();renderProps();requestRender();if(S.tab==="ia")iaSelUpdate()}
function pasteText(t){const S0=curStyle(),B=brandText(S.brand,S0),W=Math.min(S.doc.w-160,900),k=S.doc.w/1080;
  const short=t.length<=40&&!t.includes("\n");const L=short?B.title(0,0,W,t.trim(),Math.round(72*k)):B.body(0,0,W,t.trim(),Math.round(38*k));L.autoW=false;addLayer(L)}
document.addEventListener("copy",e=>{if(isTyping(e)||S.editing||!selIds().length)return;e.preventDefault();const plain=copySel(false);try{e.clipboardData.setData("text/plain",plain)}catch(_){}});
document.addEventListener("cut",e=>{if(isTyping(e)||S.editing||!selIds().length)return;e.preventDefault();if(selLayers().some(l=>l.lock)){toast("Hay un elemento bloqueado en lo seleccionado.");return}const plain=copySel(true);try{e.clipboardData.setData("text/plain",plain)}catch(_){}});
document.addEventListener("paste",e=>{if(isTyping(e)||S.editing)return;
  const files=[...(e.clipboardData?.files||[])];if(files.length){e.preventDefault();handleFiles(files);return}
  const t=e.clipboardData?e.clipboardData.getData("text/plain"):"";const c=CLIP||lsGet(CLIP_KEY,null);
  if(c&&(!t||t===c.plain)){e.preventDefault();pasteClip();return}
  if(t&&t.trim()){e.preventDefault();pasteText(t)}});

function addShape(v){const S0=curStyle(),W=S.doc.w,H=S.doc.h,m=Math.min(W,H);
  const L=v==="rect"?R({w:Math.round(m*.4),h:Math.round(m*.3),fill:S0.soft}):v==="round"?R({name:"Rectángulo redondeado",w:Math.round(m*.4),h:Math.round(m*.3),fill:S0.soft,rad:Math.round(m*.03)}):v==="ellipse"?{id:uid(),t:"ellipse",name:"Círculo",x:0,y:0,w:Math.round(m*.3),h:Math.round(m*.3),fill:S0.acc,stroke:S0.ink,sw:0,op:1}

/* ================== quitar fondo ================== */
let BGR=null,bgBusy=false;
async function removeBg(L,withAI){
  if(bgBusy)return;if(L.lock){toast("Esa imagen está bloqueada.");return}
  if(window.claude){toast("Quitar fondo funciona en la versión de GitHub del editor.",4000);return}
  bgBusy=true;const btns=["#p-nobg","#p-nobg-ai"].map(s=>$(s)).filter(Boolean);btns.forEach(b=>b.disabled=true);
  try{
    let out;
    if(withAI){const c=aiCfg();if(!c.openai)throw{msg:"Para quitar el fondo con IA hace falta la clave de OpenAI (pestaña IA → Configurar claves)."};
      setStatus("Quitando el fondo con OpenAI…");const im=await layerJpeg(L,1536);
      const res=await callOpenAI("Quita el fondo por completo y deja el fondo transparente. Conserva el sujeto principal exactamente igual: misma forma, pose, colores, rasgos y detalles. No agregues nada.",{quality:c.quality,image:im.blob,transparent:true});
      out=await (await fetch("data:image/png;base64,"+res.b64)).blob()}
    else{setStatus("Preparando la herramienta para quitar el fondo…");
      if(!BGR)BGR=import("https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm").catch(e=>{BGR=null;throw e});
      const mod=await BGR;const fn=mod.removeBackground||mod.default;
      const im=await layerJpeg(L,2048);
      out=await fn(im.blob,{model:"isnet_fp16",output:{format:"image/png"},progress:(key,cur,tot)=>{if(String(key).startsWith("fetch")&&tot)setStatus(`Descargando la herramienta (solo la primera vez)… ${Math.round(cur/tot*100)} %`);else if(String(key).startsWith("compute"))setStatus("Quitando el fondo…")}})}
    const src=await keepImage(out);await ld(src);
    if(S.doc.layers.includes(L)){L.src=src;commit();renderProps();requestRender()}
    UPS.unshift({src,name:"Sin fondo · "+(L.name||"imagen"),at:Date.now()});try{await store.setUploads(UPS.slice(0,200))}catch(e){}
    setStatus("");toast("Fondo quitado · ⌘ + Z para volver a la original")}
  catch(e){setStatus("");toast(e&&e.msg?e.msg:"No se pudo quitar el fondo. Revisa tu internet e inténtalo de nuevo, o usa «Quitar fondo con IA».",5000)}
  bgBusy=false;btns.forEach(b=>b.disabled=false)}

      ${L.fit!=="contain"?`<div class="row one">${rng("p-z","Zoom",round(L.z||1),1,5,.01)}</div><div class="row">${rng("p-fx","Horizontal",round(L.fx??.5),0,1,.01)}${rng("p-fy","Vertical",round(L.fy??.5),0,1,.01)}</div>`:""}
      <h3>Fondo de la imagen</h3>
      <div class="actions"><button class="btn" type="button" id="p-nobg">Quitar fondo</button><button class="btn" type="button" id="p-nobg-ai">Quitar fondo con IA</button></div>
      <p class="hint" style="margin-top:6px">«Quitar fondo» es gratis y funciona en tu computadora (la primera vez descarga la herramienta). «Con IA» usa OpenAI y tiene costo.</p>
      <div class="row">${num("p-rad","Redondeo",L.rad||0,1,0)}</div>`}
  if(L.t==="rect"||L.t==="ellipse"){
    h+=`<h3>Relleno</h3>${swatches("fill",L.fill,true)}<h3>Borde</h3>${swatches("stroke",L.stroke)}<div class="row">${num("p-sw","Grosor del borde",L.sw||0,1,0)}${L.t==="rect"?num("p-rad","Redondeo",L.rad||0,1,0):""}</div>`}
  if(L.t==="n")h+=`<h3>Color de la N</h3>${swatches("fill",L.fill)}`;
  if(L.t==="iso")h+=`<h3>Color principal</h3>${swatches("fill",L.fill)}<h3>Color secundario</h3>${swatches("fill2",L.fill2)}<h3>Color de la punta</h3>${swatches("fill3",L.fill3)}`;
  h+=`<h3>Posición y tamaño</h3><div class="row four">${num("p-x","X",L.x)}${num("p-y","Y",L.y)}${num("p-w","Ancho",L.w,1,4)}${L.t==="text"?`<label class="f"><span>Alto</span><input type="number" value="${round(L.h)}" disabled></label>`:num("p-h","Alto",L.h,1,4)}</div>
    ${alignHtml("Alinear en la página")}
    <div class="row one">${rng("p-op","Transparencia",L.op??1,0,1,.01)}</div>
    <h3>Acciones</h3><div class="actions"><button class="btn" type="button" id="p-copy">Copiar</button><button class="btn" type="button" id="p-paste">Pegar</button><button class="btn" type="button" id="p-dup">Duplicar</button><button class="btn" type="button" id="p-lock">${L.lock?"Desbloquear":"Bloquear"}</button>
      <button class="btn" type="button" id="p-up">Subir capa</button><button class="btn" type="button" id="p-down">Bajar capa</button>
      <button class="btn" type="button" id="p-top">Al frente</button><button class="btn" type="button" id="p-bottom">Al fondo</button>
      <button class="btn danger" type="button" id="p-del" style="grid-column:1/-1">Eliminar</button></div>
    ${layersHtml()}</div>`;
  el.innerHTML=h;
  const live=fn=>{fn();if(L.t==="text")layoutText(L);requestRender();syncGeom()};
  const on=(id,ev,fn)=>{const x=$("#"+id);if(x)x.addEventListener(ev,fn)};
  on("p-txt","input",e=>live(()=>L.txt=e.target.value));on("p-txt","change",commit);
  on("p-font","change",e=>{L.font=e.target.value;const F=FONTS[L.font];if(!F.w.includes(+L.weight))L.weight=F.w.includes(700)?700:F.w[0];commit();renderProps();requestRender()});
  on("p-size","input",e=>live(()=>L.size=Math.max(4,+e.target.value||4)));on("p-size","change",commit);
  on("p-weight","change",e=>{L.weight=+e.target.value;commit();requestRender()});
  document.querySelectorAll("[data-al]").forEach(b=>b.onclick=()=>{L.align=b.dataset.al;commit();renderProps();requestRender()});
  on("p-upper","click",()=>{L.upper=!L.upper;commit();renderProps();requestRender()});
  ["lh","ls","fx","fy","op","z"].forEach(k=>{on("p-"+k,"input",e=>{live(()=>L[k]=+e.target.value);const o=$("#p-"+k+"-v");if(o)o.textContent=e.target.value});on("p-"+k,"change",commit)});
  ["px","py","rad","sw"].forEach(k=>{on("p-"+k,"input",e=>live(()=>L[k]=Math.max(0,+e.target.value||0)));on("p-"+k,"change",commit)});
  ["x","y","w","h"].forEach(k=>{on("p-"+k,"input",e=>live(()=>{L[k]=+e.target.value||0;if(k==="w"&&L.t==="text")L.autoW=false}));on("p-"+k,"change",()=>{commit();if(k==="w")renderProps()})});
  on("p-autow","change",e=>{L.autoW=e.target.checked;commit();requestRender();syncGeom()});
  document.querySelectorAll("[data-fit]").forEach(b=>b.onclick=()=>{L.fit=b.dataset.fit;commit();renderProps();requestRender()});
  on("p-replace","click",()=>{setTab(L.name&&L.name.startsWith("Logo")?"logos":"fotos");toast("Elige la nueva imagen en el panel")});
  on("p-fill","click",()=>{Object.assign(L,{x:0,y:0,w:S.doc.w,h:S.doc.h,fit:"cover"});commit();renderProps();requestRender()});
  bindSw("color",c=>L.color=c);bindSw("tbg",c=>L.bg=c||null,true);bindSw("fill",c=>L.fill=c||null,true);bindSw("stroke",c=>{L.stroke=c;if(!L.sw)L.sw=Math.round(Math.min(S.doc.w,S.doc.h)*.006)},true);bindSw("fill2",c=>L.fill2=c);bindSw("fill3",c=>L.fill3=c);
  document.querySelectorAll("[data-align]").forEach(b=>b.onclick=()=>alignSel(b.dataset.align));
  on("g-all","click",()=>select(L.id));on("g-out","click",()=>{delete L.g;commit();renderProps();requestRender()});
  on("p-crop","click",()=>startCrop(L.id));on("p-cropdone","click",endCrop);
  on("p-cropreset","click",()=>{L.z=1;L.fx=.5;L.fy=.5;commit();renderProps();requestRender()});
  on("p-nobg","click",()=>removeBg(L,false));on("p-nobg-ai","click",()=>removeBg(L,true));
  on("p-paste","click",pasteClip);on("p-dup","click",duplicate);on("p-copy","click",()=>{let ok=false;try{ok=document.execCommand("copy")}catch(_){}if(!ok)copySel(false)});on("p-del","click",removeSel);
  on("p-lock","click",()=>{L.lock=!L.lock;commit();renderProps();requestRender()});
  on("p-up","click",()=>reorder("up"));on("p-down","click",()=>reorder("down"));on("p-top","click",()=>reorder("top"));on("p-bottom","click",()=>reorder("bottom"));
  bindLayers();
}
function bindSw(id,fn,rerender){const box=document.querySelector(`[data-sw="${id}"]`);if(!box)return;
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{fn(b.dataset.c);commit();renderProps();requestRender()});
  const cc=box.querySelector("[data-cc]");if(cc){cc.addEventListener("input",e=>{fn(e.target.value.toUpperCase());requestRender()});cc.addEventListener("change",()=>{commit();renderProps()})}}
function syncGeom(){const L=selL();if(!L)return;["x","y","w"].forEach(k=>{const i=$("#p-"+k);if(i&&document.activeElement!==i)i.value=round(L[k])});const hI=$("#p-h");if(hI&&document.activeElement!==hI)hI.value=round(L.h)}
const KIND={text:"Texto",img:"Imagen",rect:"Forma",ellipse:"Círculo",n:"La N",iso:"Isotipo"};
function layersHtml(){const a=S.doc.layers;return `<h3>Capas (${a.length})</h3><p class="hint" style="margin-top:-4px">Shift + clic para elegir varias.</p><div class="layers">${a.slice().reverse().map(L=>`<div class="layer${selIds().includes(L.id)?" on":""}${L.hide?" off":""}" data-id="${L.id}"><span class="kind">${L.g?"▣ ":""}${KIND[L.t]||""}</span><span class="nm">${esc(L.t==="text"?String(L.txt).split("\n")[0]||L.name:L.name||"")}</span><button type="button" data-hide="${L.id}" aria-label="${L.hide?"Mostrar":"Ocultar"}">${L.hide?ICON.eyeoff:ICON.eye}</button><button type="button" data-lock="${L.id}" aria-label="${L.lock?"Desbloquear":"Bloquear"}">${L.lock?ICON.lock:ICON.unlock}</button></div>`).join("")}</div>`}
function bindLayers(){document.querySelectorAll(".layer").forEach(r=>r.addEventListener("click",e=>{if(e.target.closest("button"))return;const id=r.dataset.id;
    if(e.shiftKey||e.metaKey||e.ctrlKey){const cur=selIds();setSel(cur.includes(id)?cur.filter(x=>x!==id):[...cur,id],id)}else setSel([id])}));
  document.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{const L=S.doc.layers.find(l=>l.id===b.dataset.hide);L.hide=!L.hide;commit();renderProps();requestRender()});
  document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{const L=S.doc.layers.find(l=>l.id===b.dataset.lock);L.lock=!L.lock;commit();renderProps();requestRender()})}

/* ================== open / brand ================== */
async function openTemplate(t,st){setStatus("Abriendo plantilla…");const d=await t.build(st);await Promise.all(d.layers.filter(l=>l.t==="img").map(l=>ld(l.src)));openDoc(d,true);setStatus("")}
function openDoc(d,fresh){if(S.dirty)saveNow();S.doc=d;S.sel=null;S.multi=[];S.crop=null;S.zoom=1;S.panX=0;S.panY=0;S.dirty=false;if(d.brand&&d.brand!==S.brand)setBrand(d.brand,true);
  $("#nombre").value=d.name;resetHistory();renderProps();requestRender();if(fresh)setStatus("Plantilla abierta · se guarda sola cuando la cambies");if(isNarrow())window.scrollTo({top:0,behavior:"smooth"})}
function setBrand(b,keep){S.brand=b;lsSet("ed.brand",b);document.documentElement.dataset.marca=b;
  document.querySelectorAll(".seg [data-marca]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.marca===b)));
  renderLib();if(S.doc)renderProps()}
document.querySelectorAll(".seg [data-marca]").forEach(x=>x.onclick=()=>setBrand(x.dataset.marca));
$("#nombre").addEventListener("change",e=>{S.doc.name=e.target.value.trim()||"Diseño sin nombre";e.target.value=S.doc.name;commit()});
$("#undo").onclick=undo;$("#redo").onclick=redo;

/* ================== export ================== */
const dlBtn=$("#btn-descargar"),dlMenu=$("#menu-descargar");
dlBtn.onclick=e=>{e.stopPropagation();dlMenu.hidden=!dlMenu.hidden;dlBtn.setAttribute("aria-expanded",String(!dlMenu.hidden))};
document.addEventListener("click",e=>{if(!dlMenu.hidden&&!e.target.closest(".menuwrap")){dlMenu.hidden=true;dlBtn.setAttribute("aria-expanded","false")}});
dlMenu.querySelectorAll("[data-fmt]").forEach(b=>b.onclick=()=>{dlMenu.hidden=true;exportImg(b.dataset.fmt)});
async function exportImg(fmt){
  if(S.editing)endEdit();
  const d=S.doc;await Promise.all(d.layers.filter(l=>l.t==="img").map(l=>ld(l.src)));await fontsReady;
  const c=document.createElement("canvas");c.width=d.w;c.height=d.h;const x=c.getContext("2d");drawDesign(x,d);
  const type=fmt==="jpg"?"image/jpeg":"image/png";
  let blob;try{blob=await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(),type,.92))}catch(e){toast("No se pudo preparar la imagen.");return}
  const fname=(d.name||"diseno").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()+"."+fmt;
  if(store.downloads){try{await store.downloads.save({filename:fname,data:blob});toast("Imagen descargada");return}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Ya hay una descarga esperando tu confirmación.");return}}}
  const url=URL.createObjectURL(blob);
  if(!window.claude){const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast("Imagen descargada");return}
  showDialog("Tu imagen",`<p class="hint" style="text-align:center;margin-bottom:12px">Para guardarla: clic derecho sobre la imagen → «Guardar imagen como…». En el celular, mantén el dedo sobre ella.</p><img class="preview-img" src="${url}" alt="Diseño listo para guardar">`);
}

/* ================== dialogs: my designs ================== */
function showDialog(title,body){const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2><button class="btn" type="button" data-close>Cerrar</button></header><div class="body">${body}</div></div>`;
  document.body.appendChild(v);const close=()=>v.remove();v.addEventListener("click",e=>{if(e.target===v||e.target.closest("[data-close]"))close()});
  v.addEventListener("keydown",e=>{if(e.key==="Escape")close()});v.querySelector("[data-close]").focus();return v}
$("#btn-disenos").onclick=async()=>{
  if(S.dirty)await saveNow();
  const v=showDialog("Mis diseños",`<div class="empty">Cargando tus diseños…</div>`);const body=v.querySelector(".body");
  let list=[];try{list=await store.list()}catch(e){body.innerHTML=`<div class="empty">No se pudieron cargar tus diseños. Revisa tu conexión y vuelve a abrir.</div>`;return}
  list.sort((a,b)=>(b.updated||0)-(a.updated||0));
  const draw=()=>{body.innerHTML=(store.kind!=="db"?`<p class="hint">Estos diseños están guardados en este navegador. Si abres el editor en otra computadora, no aparecerán ahí.</p>`:"")+(list.length?`<div class="designs">${list.map((d,i)=>`<div class="dcard"><button type="button" class="pic" data-open="${i}" aria-label="Abrir ${esc(d.name)}">${d.thumb?`<img src="${d.thumb}" alt="">`:""}</button><div class="meta"><b>${esc(d.name)}</b><small>${BR[d.brand]?BR[d.brand].name:""} · ${d.w}×${d.h} · ${new Date(d.updated||0).toLocaleDateString("es-BO",{day:"numeric",month:"short"})}</small></div><div class="acts" data-acts="${i}"><button type="button" data-open="${i}">Abrir</button><button type="button" data-copy="${i}">Duplicar</button><button type="button" data-del="${i}">Eliminar</button></div></div>`).join("")}</div>`:`<div class="empty">Todavía no tienes diseños guardados. Abre una plantilla y cámbiale algo: se guarda sola.</div>`);
    body.querySelectorAll("[data-open]").forEach(b=>b.onclick=async()=>{let d;try{d=await store.get(list[+b.dataset.open].id)}catch(e){}if(!d){toast("No se pudo abrir ese diseño.");return}openDoc({id:d.id,name:d.name,brand:d.brand,w:d.w,h:d.h,bg:d.bg,layers:clone(d.layers||[])});v.remove()});
    body.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{let s;try{s=await store.get(list[+b.dataset.copy].id)}catch(e){}if(!s){toast("No se pudo duplicar.");return}const d=newDoc(s.w,s.h,s.bg,s.brand,s.name+" (copia)");d.layers=clone(s.layers||[]);d.thumb=s.thumb;try{await store.put(d)}catch(e){toast("No se pudo duplicar.");return}list.unshift(Object.assign({updated:Date.now()},d));draw()});
    body.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const i=+b.dataset.del,box=body.querySelector(`[data-acts="${i}"]`);box.innerHTML=`<span style="font-size:11.5px;align-self:center">¿Eliminar?</span><button type="button" data-yes>Sí, eliminar</button><button type="button" data-no>No</button>`;
      box.querySelector("[data-no]").onclick=draw;box.querySelector("[data-yes]").onclick=async()=>{try{await store.del(list[i].id)}catch(e){toast("No se pudo eliminar.");return}if(list[i].id===S.doc.id)S.dirty=false;list.splice(i,1);draw()}});};
  draw();
};

/* ================== boot ================== */
const fontsReady=(async()=>{try{await Promise.all(["600 40px Akshar","700 40px Akshar","400 40px Questrial","400 40px \"Adventor CX\"","700 40px \"Adventor CX\"","400 40px Arimo","700 40px Arimo"].map(f=>document.fonts.load(f)))}catch(e){}})();
(async function boot(){
  document.documentElement.dataset.marca=S.brand;
  document.querySelectorAll(".seg [data-marca]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.marca===S.brand)));
  S.doc=newDoc(1080,1350,BR[S.brand].st.claro.bg,S.brand);resetHistory();renderProps();renderLib();
  await fontsReady;
  const t=TPL[S.brand].find(t=>t.id.endsWith("post-foto"));const d=await t.build("claro");openDoc(d);setStatus("");
  renderLib();
  await initStore();
  const last=lsGet("ed.last",null);
  if(last){try{const x=await store.get(last);if(x&&!S.dirty&&S.hi===0){openDoc({id:last,name:x.name,brand:x.brand,w:x.w,h:x.h,bg:x.bg,layers:clone(x.layers||[])});setStatus("Seguiste donde te quedaste")}}catch(e){}}
  document.fonts&&document.fonts.addEventListener&&document.fonts.addEventListener("loadingdone",()=>{requestRender();refreshThumbs()});
})();
window.addEventListener("beforeunload",()=>{if(S.dirty)saveNow()});
</script>
