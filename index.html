<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" href="marca/favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="marca/icono-app-principal.svg">
<link rel="apple-touch-icon" href="marca/icono-app-principal-180.png">
<meta name="theme-color" content="#235347">
<script src="firebase-config.js"></script>
</head>
<body>
<!-- PAGINA -->
<title>EdiThor Nummeros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&display=swap">
<style>
@font-face{font-family:"Akshar";font-weight:600;font-display:swap;src:url(fonts/Akshar-600.woff2) format("woff2")}
@font-face{font-family:"Akshar";font-weight:700;font-display:swap;src:url(fonts/Akshar-700.woff2) format("woff2")}
@font-face{font-family:"Questrial";font-weight:400;font-display:swap;src:url(fonts/Questrial-400.woff2) format("woff2")}
@font-face{font-family:"Adventor CX";font-weight:400;font-display:swap;src:url(fonts/Adventor-400.woff2) format("woff2")}
@font-face{font-family:"Adventor CX";font-weight:700;font-display:swap;src:url(fonts/Adventor-700.woff2) format("woff2")}
/* Layout: one-screen tool. Header bar, then four columns: icon rail · library · canvas stage · properties. On phones the stage comes first and the panels stack below it.
   Look: the same as the other NUMMEROS systems (nummeros-tokens.css): mint side menu with the active item in green, white cards with 16 px corners, Akshar for titles and Questrial for text. */
:root{
  --bg:#F4FAF5; --panel:#FFFFFF; --line:#DAF1DE; --ink:#163832; --muted:#557363; --field:#EEF7F0; --stage:#E4EFE7; --hover:#E6F3E9;
  --menu:#DAF1DE; --menu-ink:#163832; --ctl:#B9D6C1;
  --acc:#235347; --on-acc:#FFFFFF; --danger:#B42318; --ok:#2E7D5B; --navy:#152644; --on-navy:#FFFFFF;
  --ui:Questrial,"Century Gothic","Avenir Next",sans-serif;
  --head:"Akshar","Arial Narrow",sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(5,31,32,.08); --shadow-lg:0 10px 30px rgba(5,31,32,.16);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#051F20; --panel:#0B2B26; --line:#1C4239; --ink:#DAF1DE; --muted:#8EB69B; --field:#163832; --stage:#041718; --hover:#163832;
  --menu:#0B2B26; --menu-ink:#DAF1DE; --ctl:#2F5E50;
  --acc:#8EB69B; --on-acc:#051F20; --danger:#F97066; --ok:#6FCF9F; --navy:#C9D2D5; --on-navy:#011230; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#051F20; --panel:#0B2B26; --line:#1C4239; --ink:#DAF1DE; --muted:#8EB69B; --field:#163832; --stage:#041718; --hover:#163832;
  --menu:#0B2B26; --menu-ink:#DAF1DE; --ctl:#2F5E50;
  --acc:#8EB69B; --on-acc:#051F20; --danger:#F97066; --ok:#6FCF9F; --navy:#C9D2D5; --on-navy:#011230; --shadow:none; --shadow-lg:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:8px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.brandmark{display:flex;align-items:center;gap:8px;font:700 17px/1 var(--head);letter-spacing:.02em;white-space:nowrap}
.brandmark svg{width:18px;height:24px;flex:none}
.brandmark small{display:block;font:600 10px/1.2 var(--head);letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:999px;padding:5px 12px;font:600 13px var(--head);letter-spacing:.04em;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
#nombre{min-width:0;flex:0 1 220px;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:600}
#nombre:hover,#nombre:focus{border-color:var(--line);background:var(--field)}
.spacer{flex:1}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:6px 10px;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.icon{padding:6px;width:32px;height:32px}
.btn svg{width:16px;height:16px;flex:none}
.btn[disabled]{opacity:.4;cursor:default}
.btn.danger{color:var(--danger)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:6px;z-index:30;min-width:200px;display:grid;gap:2px}
.menu button{border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:6px}
.menu button:hover{background:var(--hover)}
.menu button small{display:block;color:var(--muted);font-size:11.5px}
.menu .menu-sep{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 10px 2px;border-top:1px solid var(--line);margin-top:4px}
.menu button[disabled]{opacity:.45;cursor:default}
.menu button[aria-checked="true"]{color:var(--acc);font-weight:700}
.menu button[aria-checked="true"]::after{content:" ✓"}

/* main grid */
.main{display:grid;grid-template-columns:68px 300px minmax(0,1fr) 290px;min-height:0;position:relative}
.rrail{display:none}
.main.compact{grid-template-columns:68px minmax(0,1fr) 60px}
.main.compact .lib,.main.compact .props{position:absolute;top:0;bottom:0;z-index:8;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.main.compact .lib{left:68px;width:300px}
.main.compact .props{right:60px;width:290px}
.main.compact:not(.lib-open) .lib,.main.compact:not(.props-open) .props{display:none}
.main.compact .rrail{display:flex;flex-direction:column;gap:2px;padding:8px 5px;background:var(--panel);border-left:1px solid var(--line);padding-right:max(5px,env(safe-area-inset-right,0px))}
.rrail button{border:0;background:transparent;border-radius:8px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted)}
.rrail button svg{width:22px;height:22px}
.rrail button:hover{background:var(--hover);color:var(--ink)}
.rrail button[aria-selected="true"]{background:var(--field);color:var(--acc);font-weight:600}
.main.compact.lib-open .bottombar{left:312px}
.main.compact.props-open .bottombar{right:302px}
.main.compact.lib-open .ctxbar{left:calc(50% + 150px);max-width:calc(100% - 336px)}
.main.compact.props-open .ctxbar{left:calc(50% - 145px);max-width:calc(100% - 326px)}
.main.compact.lib-open.props-open .ctxbar{left:calc(50% + 5px);max-width:calc(100% - 626px)}
#btn-acct{border-radius:999px;font-weight:700;background:var(--acc);color:var(--on-acc);border-color:var(--acc)}
#btn-acct img{width:100%;height:100%;border-radius:999px;object-fit:cover}
.menu .acct-mail{padding:8px 10px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
.login-err{color:var(--danger);font-size:13px;margin:0}
.cloudnote{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:12px;margin-bottom:14px;display:grid;gap:8px;font-size:13px}
#btn-panels[aria-pressed="true"]{background:var(--field);color:var(--acc);border-color:var(--acc)}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:8px 6px;padding-left:max(6px,env(safe-area-inset-left,0px))}
.rail button{border:0;background:transparent;border-radius:8px;padding:8px 2px 6px;display:grid;justify-items:center;gap:4px;font-size:11px;color:var(--muted)}
.rail button svg{width:22px;height:22px}
.rail button:hover{background:var(--hover);color:var(--ink)}
.rail button[aria-selected="true"]{background:var(--field);color:var(--acc);font-weight:600}
.rail .only-mobile{display:none}
.lib,.props{background:var(--panel);overflow:auto;min-height:0}
.lib{border-right:1px solid var(--line)}
.props{border-left:1px solid var(--line)}
.pane{padding:14px 14px 28px}
.pane h2{font:700 20px/1.1 var(--head);margin:0 0 4px;letter-spacing:.01em}
.pane h3{font:600 12px/1.2 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.pane p.hint{color:var(--muted);margin:0 0 10px;font-size:12.5px}

/* library grids */
.thumbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.thumbs.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.thumb{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:0;overflow:hidden;display:flex;flex-direction:column;text-align:left;min-width:0}
.thumb:hover{border-color:var(--acc)}
.thumb .pic{display:grid;place-items:center;aspect-ratio:1;background:var(--stage);overflow:hidden;max-width:100%}
.thumb .pic.dark{background:#0E1A1C}
.thumb .pic img,.thumb .pic canvas{width:100%;height:100%;object-fit:cover;display:block}
.thumb .pic.contain img{object-fit:contain;padding:10px}
.thumb .pic canvas{object-fit:contain}
.thumb span{padding:6px 8px;font-size:11.5px;line-height:1.25;color:var(--ink)}
.thumb span small{display:block;color:var(--muted);font-size:10.5px}
.addlist{display:grid;gap:6px}
.addlist button{border:1px solid var(--line);background:var(--field);border-radius:8px;text-align:left;padding:10px 12px}
.addlist button:hover{border-color:var(--acc)}
.addlist .a1{font:700 24px/1 var(--head)}
.addlist .a2{font:600 17px/1.1 var(--head)}
.addlist .a3{font-size:14px}
.addlist .a4{font:600 12px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--acc)}
.addlist .a5{display:inline-block;background:var(--acc);color:var(--on-acc);border-radius:999px;padding:4px 12px;font:600 13px var(--head)}
.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.shapes button{border:1px solid var(--line);background:var(--field);border-radius:8px;aspect-ratio:1;display:grid;place-items:center;gap:2px;padding:6px;font-size:11px;color:var(--muted)}
.shapes button:hover{border-color:var(--acc)}
.shapes svg{width:42px;height:42px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:18px 12px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--acc);background:var(--field)}
.toggle2{display:flex;gap:6px;margin-bottom:10px}
.toggle2 button{flex:1;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:6px;font-weight:600}
.toggle2 button[aria-pressed="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc)}

/* stage */
.stage{position:relative;background:var(--stage);min-width:0;min-height:0;overflow:hidden;touch-action:none}
.bottombar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap;pointer-events:none;z-index:4}
.bottombar>*{pointer-events:auto}
@media (max-width:1500px){.main:not(.compact) .pagebar .sizetag{display:none}}
.gridctl{display:flex;gap:0}
.gridctl #grid-btn{border-top-right-radius:0;border-bottom-right-radius:0}
.gridctl #grid-opt{border-top-left-radius:0;border-bottom-left-radius:0;border-left:0;padding:0 9px}
#sel-mode[aria-pressed="true"],#grid-btn[aria-pressed="true"]{color:var(--acc);border-color:var(--acc);background:var(--field)}
.pvbtn{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);height:38px}
.ctxbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);max-width:calc(100% - 24px);display:flex;gap:2px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);overflow-x:auto;scrollbar-width:none;z-index:4;white-space:nowrap}
.ctxbar::-webkit-scrollbar{display:none}
.ctxbar:empty{display:none}
.ctxbar .tb{border:0;background:transparent;border-radius:6px;height:30px;min-width:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);flex:none}
.ctxbar .tb:hover{background:var(--hover)}
.ctxbar .tb[aria-pressed="true"]{background:var(--field);color:var(--acc)}
.ctxbar .tb.pri{background:var(--acc);color:var(--on-acc)}
.ctxbar .tb.danger{color:var(--danger)}
.ctxbar .tb svg{width:16px;height:16px;flex:none}
.ctxbar .sep{width:1px;height:20px;background:var(--line);margin:0 4px;flex:none}
.ctxbar select{height:30px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:0 6px;font-size:12.5px;max-width:150px;flex:none}
.ctxbar .num{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;flex:none}
.ctxbar input.num{width:58px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;font-size:13px;padding:0 4px;-moz-appearance:textfield}
.ctxbar input.num::-webkit-inner-spin-button,.ctxbar input.num::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.ctxbar .lbl{font-size:12px;color:var(--muted);padding:0 6px;flex:none}
.chip-c{width:18px;height:18px;border-radius:5px;border:1px solid rgba(127,127,127,.55);display:inline-block}
.chip-c.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--panel)}
.ctxpop{position:fixed;z-index:35;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:10px;max-width:min(320px,calc(100vw - 24px))}
.pv{position:fixed;inset:0;z-index:50;background:#0B0F10;display:grid;grid-template-rows:minmax(0,1fr) auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.pv .pvstage{display:grid;place-items:center;min-height:0;padding:24px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.pv canvas{box-shadow:0 10px 40px rgba(0,0,0,.5);display:block}
.pv .pvbar{display:flex;gap:8px;justify-content:center;align-items:center;padding:12px 16px;color:#E5EBEA;flex-wrap:wrap}
.pv .pvbar button{background:#1E2628;color:#E5EBEA;border:1px solid #273033;border-radius:8px;padding:7px 12px;font-weight:600}
.pv .pvbar button:hover{background:#273033}
.pv .pvbar button[disabled]{opacity:.35}
.pv .pvbar span{font-variant-numeric:tabular-nums;font-size:13px;min-width:120px;text-align:center}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.stagebar{position:relative;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.stagebar .btn{border:0;height:28px;padding:4px 8px}
.stagebar output{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
.pagebar{position:relative;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 4px 14px rgba(0,0,0,.12);max-width:calc(100% - 24px);flex-wrap:wrap}
.pagebar .btn{border:0;height:28px;padding:4px 9px}
.pagebar #pg-lbl{font-size:12px;font-weight:600;padding:0 4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pagebar .sizetag{position:static;border:0;background:transparent;padding:0 6px}
.pages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}
.pg{border:1px solid var(--line);background:var(--stage);border-radius:6px;padding:4px;display:grid;gap:3px;justify-items:center;font-size:11px;color:var(--muted);min-width:0}
.pg canvas{max-width:100%;height:auto;display:block;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.pg[aria-current="true"]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);color:var(--acc);font-weight:700}
.sizetag-old{font-size:11.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
#editor-txt{position:absolute;margin:0;border:0;outline:1.5px dashed #2E90FA;background:transparent;resize:none;overflow:hidden;white-space:pre-wrap;word-break:normal;overflow-wrap:break-word;z-index:5;padding:0}
.dropveil{position:absolute;inset:0;background:rgba(46,144,250,.12);border:2px dashed #2E90FA;display:grid;place-items:center;font-weight:700;font-size:15px;color:#2E90FA;z-index:6}

/* properties */
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:8px}
.row.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.row.one{grid-template-columns:1fr}
.f{display:grid;gap:4px;min-width:0}
.f>span{font-size:11.5px;color:var(--muted)}
.f input[type=number],.f input[type=text],.f select,.f textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
.f textarea{min-height:84px;resize:vertical;line-height:1.4}
.f input[type=range]{width:100%;accent-color:var(--acc)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.sw{width:24px;height:24px;border-radius:6px;border:1px solid rgba(127,127,127,.45);padding:0}
.sw[aria-pressed="true"]{outline:2px solid var(--acc);outline-offset:2px}
.sw.none{background:linear-gradient(135deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%),var(--panel)}
.sw.custom{position:relative;overflow:hidden;background:conic-gradient(#f44,#fd4,#4d6,#4cf,#46f,#d4f,#f44)}
.sw.custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer;width:40px;height:40px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:5px 8px;font-size:12px;min-width:32px}
.chips button[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.chips svg{width:16px;height:16px;display:block}
.check{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:6px 0}
.check input{accent-color:var(--acc);width:16px;height:16px}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.layers{display:grid;gap:2px}
.layer{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:6px;padding:4px 6px;cursor:pointer;min-width:0}
.layer:hover{background:var(--hover)}
.layer.on{border-color:var(--acc);background:var(--field)}
.layer .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px}
.layer .kind{font-size:10.5px;color:var(--muted);width:44px;flex:none}
.layer button{border:0;background:transparent;padding:2px;border-radius:4px;color:var(--muted);display:grid}
.layer button:hover{color:var(--ink);background:var(--hover)}
.layer button svg{width:15px;height:15px}
.layer.off .nm{opacity:.45}

/* overlays */
.pv~.veil{z-index:52}
.veil{position:fixed;inset:0;background:rgba(5,10,12,.5);z-index:40;display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;min-height:0;box-shadow:0 20px 60px rgba(0,0,0,.35)}

.sgrid{columns:2;column-gap:8px;margin-top:10px}
.sgrid button{display:block;width:100%;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:0;margin:0 0 8px;overflow:hidden;cursor:pointer;break-inside:avoid;position:relative}
.sgrid img{display:block;width:100%;height:auto;min-height:40px}
.sgrid button:hover{border-color:var(--acc)}
.sgrid button.busy::after{content:"Agregando…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,31,32,.55);color:#fff;font-size:12px}
.extlinks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.extlinks a{text-align:center;text-decoration:none}
/* sign-in page: light background with the soft N pattern and the stacked logo */
.login{position:fixed;inset:0;z-index:45;background:var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.login::before{content:"";position:absolute;inset:0;background:url(graficos/pat-patron-n.png) center/420px repeat;opacity:.07;pointer-events:none}
.login .lcard{position:relative;width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-lg);padding:36px 30px 28px;display:grid;gap:14px;justify-items:center;text-align:center}
.login .lcard .lgs{height:118px;width:auto}
.login h1{font:700 32px/1 var(--head);margin:6px 0 0}
.login p{margin:0;color:var(--muted)}
.login .gbtn{width:100%;height:46px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;background:var(--acc);color:var(--on-acc);font:600 16px/1 var(--head);letter-spacing:.02em}
.login .gbtn svg{width:20px;height:20px;background:#fff;border-radius:50%;padding:2px}
.login .lsec{width:100%;border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px;color:var(--muted);font-size:12.5px}
.login .foot{font-size:11.5px;color:var(--muted);margin-top:4px}
.login .lgs.lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .login .lgs.lg-l{display:none}:root:not([data-theme="light"]) .login .lgs.lg-d{display:block}}
:root[data-theme="dark"] .login .lgs.lg-l{display:none}:root[data-theme="dark"] .login .lgs.lg-d{display:block}
/* NUMMEROS · pantalla de espera 6 «los clásicos trabajando» (kit de marca) */
.nm-overlay{position:fixed;inset:0;z-index:55;background:var(--bg);display:grid;place-items:center;transition:opacity .45s ease}
.nm-overlay.out{opacity:0;pointer-events:none}
.nm-pantalla{position:relative;overflow:hidden;width:100%;height:100%;display:grid;place-items:center;padding:40px 24px}
.nm-marca-agua{position:absolute;right:-60px;bottom:-110px;width:300px;height:auto;opacity:.5;pointer-events:none}
.nm-marca-agua path{fill:var(--line)}
.nm-panel{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;max-width:340px;width:100%}
.nm-retrato{position:relative;width:132px;height:132px;border-radius:50%;overflow:hidden;flex:none;background:var(--line);box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(5,31,32,.12)}
.nm-retrato img{width:100%;height:100%;object-fit:cover;display:block;animation:nmAparecer .6s ease-out both}
.nm-retrato::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(70% 60% at 30% 70%,rgba(142,182,155,.55),transparent 65%);animation:nmLuz 2.6s ease-in-out infinite}
@keyframes nmLuz{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes nmAparecer{from{opacity:0;transform:scale(1.06)}to{opacity:1;transform:none}}
.nm-logo-marca{height:26px;width:auto;display:block}
.nm-titulo{font:600 24px/1.2 var(--head);margin:0;color:var(--ink)}
.nm-paso{font-size:14px;margin:0;color:var(--muted)}
.nm-barra{width:190px;height:8px;border-radius:999px;overflow:hidden;position:relative;background:var(--line)}
.nm-barra::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(120deg,var(--acc) 0 9px,var(--line) 9px 18px);background-size:36px 100%;animation:nmCorrer .62s linear infinite}
@keyframes nmCorrer{from{background-position:0 0}to{background-position:36px 0}}
.nm-overlay .lg-d{display:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .nm-overlay .lg-l{display:none}:root:not([data-theme="light"]) .nm-overlay .lg-d{display:block}}
:root[data-theme="dark"] .nm-overlay .lg-l{display:none}:root[data-theme="dark"] .nm-overlay .lg-d{display:block}
@media (prefers-reduced-motion:reduce){.nm-barra::before,.nm-retrato::after,.nm-retrato img,.hero-pic img{animation:none!important}}

/* equipo: estados, papelera, versiones, espacio, plantillas del equipo, uso de IA */
.imgseg{display:flex;gap:4px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px;margin:0 0 12px}
.imgseg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 6px;font:600 13.5px/1 var(--head);letter-spacing:.02em;color:var(--muted);white-space:nowrap}
.imgseg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.stdot{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none;background:#9AA9A2;vertical-align:0}
.stdot.st-revision{background:#E6A23C}.stdot.st-aprobado{background:#2E9E6B}.stdot.st-publicado{background:#3B6FD8}
.cx-lbl{font:600 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:12px 10px 6px}
.cx-it .stdot{margin:0 4px 0 2px}
.editing{display:inline-flex;align-items:center;gap:4px;margin-top:4px;font-size:11px;font-weight:700;color:#B54708;background:#FEF0C7;border-radius:999px;padding:2px 8px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cx .dcard .acts2{flex-wrap:wrap}
.cx .dcard .acts2 select[data-dl]{flex:1 1 96px}
.cx .dcard .acts2 select.more{flex:0 0 auto;width:44px;padding:5px 2px;text-align:center}
.cx .dcard .acts2 .del{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.cx .dcard .acts2 .del svg{width:14px;height:14px}
.cx-space{padding:2px 10px 12px;display:grid;gap:6px}
.cx-space small{color:var(--muted);font-size:11.5px;line-height:1.4}
.spbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.spbar i{display:block;height:100%;background:var(--acc);border-radius:999px}
.spbar.warn i{background:#E6A23C}.spbar.full i{background:var(--danger)}
.vtools{display:flex;justify-content:flex-end;margin-bottom:10px}
.vlist{display:grid;gap:8px}
.vrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--panel)}
.vrow img,.vrow .vimg{width:54px;height:54px;object-fit:contain;border-radius:8px;background:var(--stage);flex:none}
.vrow .vmeta{flex:1;min-width:0;display:grid;gap:2px}.vrow .vmeta small{color:var(--muted);font-size:11.5px}
.vrow .btn{padding:6px 10px;font-size:12.5px}
.thumb.ttpl{position:relative}
.thumb.ttpl .pic{border:0;padding:0;width:100%;cursor:pointer}
.thumb.ttpl .tdel{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:15px;line-height:1;display:grid;place-items:center;padding:0}
.dpages{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px;max-height:46vh;overflow:auto;padding:2px}
.dpg{display:grid;gap:4px;justify-items:center;border:1px solid var(--line);border-radius:12px;padding:8px;cursor:pointer;position:relative;background:var(--panel)}
.dpg input{position:absolute;top:8px;left:8px;width:18px;height:18px;accent-color:var(--acc)}
.dpg:has(input:checked){border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.dpg .dpic{display:grid;place-items:center;min-height:90px}.dpg .dpic canvas{max-width:100%;height:auto;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.dpg small{color:var(--muted);font-size:11.5px;text-align:center}
.utab{width:100%;border-collapse:collapse;font-size:13px}
.utab th,.utab td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.utab th{font:600 12px var(--head);letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.utab td:not(:first-child),.utab th:not(:first-child){text-align:right;font-variant-numeric:tabular-nums}

/* phones and narrow windows */
@media (max-width:900px){
  .bottombar{justify-content:center}
  .pagebar .sizetag{display:none}
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .top{flex-wrap:wrap}
  #nombre{order:5;flex:1 1 100%}
  .status{display:none}
  .hide-narrow{display:none}
  .main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage{height:58vh;order:1;border-bottom:1px solid var(--line)}
  .rail{order:2;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .rail button{min-width:62px}
  .rail .only-mobile{display:grid}
  .lib,.props{order:3;border:0;overflow:visible}
  .main[data-tab="editar"] .lib{display:none}
  .main:not([data-tab="editar"]) .props{display:none}
  .pane{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

const MC=document.createElement("canvas").getContext("2d");
const HAS_LS="letterSpacing" in MC;
function fontStr(L,s){const f=FONTS[L.font]||FONTS.Questrial;return `${L.weight||400} ${s??L.size}px ${f.css}`}
function setFont(ctx,L){ctx.font=fontStr(L);if(HAS_LS)ctx.letterSpacing=((L.ls||0)*L.size)+"px"}
function layoutText(L){
  setFont(MC,L);
  const raw=L.upper?String(L.txt).toUpperCase():String(L.txt);
  const px=L.px||0,py=L.py||0;
  const maxW=L.autoW?Infinity:Math.max(10,L.w-px*2);
  const lines=[],ends=[];
  for(const para of raw.split("\n")){
    const words=para.split(/ +/);let line="";
    if(!para){lines.push("");ends.push(true);continue}
    for(const w of words){const test=line?line+" "+w:w;if(line&&MC.measureText(test).width>maxW){lines.push(line);ends.push(false);line=w}else line=test}
    lines.push(line);ends.push(true);
  }
  const widths=lines.map(l=>MC.measureText(l).width);
  if(L.autoW)L.w=Math.ceil(Math.max(10,...widths)+px*2);
  L.h=Math.ceil(lines.length*L.size*(L.lh||1.2)+py*2);
  L._lines=lines;L._widths=widths;L._ends=ends;
}
/* justified text: every line except the last of each paragraph fills the box; returns [[word,x],...] or null */
function justWords(L,i,x0,inner){if(L.align!=="justify"||!L._ends||L._ends[i])return null;const ws=L._lines[i].split(/ +/).filter(Boolean);if(ws.length<2)return null;

function drawLayer(ctx,L,editingId){
  if(L.hide)return;
  ctx.save();ctx.globalAlpha=L.op??1;
  const {x,y,w,h}=L;
  if(L.rot&&L.t!=="text"){const cx=x+w/2,cy=y+h/2;ctx.translate(cx,cy);ctx.rotate(radOf(L));ctx.translate(-cx,-cy)}
  if(L.t==="rect"){rr(ctx,x,y,w,h,L.rad);if(L.fill){ctx.fillStyle=L.fill;ctx.fill()}if(L.sw>0&&L.stroke){ctx.lineWidth=L.sw;ctx.strokeStyle=L.stroke;ctx.stroke()}}
  else if(L.t==="ellipse"){ctx.beginPath();ctx.ellipse(x+w/2,y+h/2,Math.abs(w/2),Math.abs(h/2),0,0,Math.PI*2);if(L.fill){ctx.fillStyle=L.fill;ctx.fill()}if(L.sw>0&&L.stroke){ctx.lineWidth=L.sw;ctx.strokeStyle=L.stroke;ctx.stroke()}}

    if(L.rad){rr(ctx,x,y,w,h,L.rad);ctx.clip()}else{ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip()}
    if(r.ok){const iw=r.im.naturalWidth,ih=r.im.naturalHeight;const s=L.fit==="contain"?Math.min(w/iw,h/ih):Math.max(w/iw,h/ih)*(L.z||1);const dw=iw*s,dh=ih*s;ctx.drawImage(r.im,x+(w-dw)*(L.fx??.5),y+(h-dh)*(L.fy??.5),dw,dh)}
    else{ctx.fillStyle=r.err?"rgba(180,35,24,.15)":"rgba(127,127,127,.18)";ctx.fillRect(x,y,w,h)}
  }
  else if(L.t==="n"){ctx.translate(x,y);ctx.scale(w/546,h/728);ctx.fillStyle=L.fill;ctx.fill(P2D.n)}
  else if(L.t==="iso"){ctx.translate(x,y);ctx.scale(w/ISO.w,h/ISO.h);ctx.fillStyle=L.fill2;ctx.fill(P2D.gris);ctx.fillStyle=L.fill3;ctx.fill(P2D.negro);ctx.fillStyle=L.fill;ctx.fill(P2D.azul)}

    layoutText(L);
    if(L.bg){rr(ctx,x,y,L.w,L.h,L.rad);ctx.fillStyle=L.bg;ctx.fill()}

const IDB={p:null,
  open(){return this.p||(this.p=new Promise((res,rej)=>{try{const r=indexedDB.open("editor-marca",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("abort"))})},
  async del(k){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}};
const store={kind:"local",db:null,uid:null,assets:null,downloads:null,idb:false,
  col(){return this.db.collection("data/users/"+this.uid)},
  async list(){if(this.kind==="fb"){const M=FB.m,q=await M.getDocs(M.collection(FB.db,"designs"));return q.docs.map(x=>{const v=x.data();return{id:x.id,name:v.name,brand:v.brand,w:v.w,h:v.h,thumb:v.thumb||"",updated:v.updated||0,sec:v.sec||"",fam:v.fam||"",st:v.st||"",np:(()=>{try{return(JSON.parse(v.data||"{}").pages||[]).length||1}catch(e){return 1}})(),by:v.by||"",byName:v.byName||"",ed:v.ed||"",edName:v.edName||"",_sz:(v.data||"").length+(v.thumb||"").length}})}
    if(this.kind==="db"){const q=await this.col().get();return q.docs.filter(s=>s.id.startsWith("d-")).map(s=>Object.assign({id:s.id},s.data()))}
    if(this.idb)return(await IDB.get("index"))||[];
    return lsGet("ed.designs",[])},
  async get(id){if(this.kind==="fb"){const x=await FB.m.getDoc(fbDoc("designs",id));if(!x.exists())return null;const v=x.data();let more={};try{more=JSON.parse(v.data||"{}")}catch(e){}const o=Object.assign({id},v,more);delete o.data;return o}
    if(this.kind==="db"){const s=await this.col().doc(id).get();return s.exists?Object.assign({id},s.data()):null}
    if(this.idb){const d=await IDB.get("d:"+id);return d?Object.assign({id},d):null}
    return lsGet("ed.designs",[]).find(x=>x.id===id)||null},
  async put(d){const rec={name:d.name,brand:d.brand,w:d.w,h:d.h,mm:d.mm||null,folds:d.folds||null,pages:d.pages||[{id:"p1",bg:d.bg,layers:d.layers||[]}],thumb:d.thumb||"",updated:Date.now()};
    /* every design is shared with the whole team: it keeps who created it and who changed it last */
    /* "sec" = section/apartado where the design is filed; the editor's saves leave it as it is (merge), only moving it or duplicating sets it */
    const hasSec=typeof d.sec==="string",hasFam=typeof d.fam==="string"&&!!d.fam;
    if(this.kind==="fb"){const me=fbMe();const o={name:rec.name||"",brand:rec.brand||"nummeros",w:rec.w,h:rec.h,thumb:rec.thumb,updated:rec.updated,by:d.by||me.email,byName:d.by?(d.byName||""):me.name,ed:me.email,edName:me.name,data:JSON.stringify({pages:rec.pages,mm:rec.mm,folds:rec.folds})};if(hasSec)o.sec=d.sec;if(hasFam)o.fam=d.fam;await FB.m.setDoc(fbDoc("designs",d.id),o,{merge:true});return}
    if(this.kind==="db"){if(hasSec)rec.sec=d.sec;if(hasFam)rec.fam=d.fam;await this.col().doc(d.id).set(rec,{merge:true});return}
    if(this.idb){const old=await IDB.get("d:"+d.id);rec.sec=hasSec?d.sec:(old&&old.sec)||"";rec.fam=hasFam?d.fam:(old&&old.fam)||"";await IDB.set("d:"+d.id,rec);const idx=((await IDB.get("index"))||[]).filter(x=>x.id!==d.id);idx.unshift({id:d.id,name:rec.name,brand:rec.brand,w:rec.w,h:rec.h,thumb:rec.thumb,updated:rec.updated,sec:rec.sec,fam:rec.fam,np:(rec.pages||[]).length||1});await IDB.set("index",idx);return}
    {const old=lsGet("ed.designs",[]).find(x=>x.id===d.id);rec.sec=hasSec?d.sec:(old&&old.sec)||"";rec.fam=hasFam?d.fam:(old&&old.fam)||""}
    const all=lsGet("ed.designs",[]).filter(x=>x.id!==d.id);all.unshift(Object.assign({id:d.id},rec));localStorage.setItem("ed.designs",JSON.stringify(all.slice(0,30)))},
  async patch(id,o){if(this.kind==="fb"){await FB.m.updateDoc(fbDoc("designs",id),o);return}
    if(this.kind==="db"){await this.col().doc(id).update(o);return}
    if(this.idb){const d=await IDB.get("d:"+id);if(d){Object.assign(d,o);await IDB.set("d:"+id,d)}const idx=(await IDB.get("index"))||[];const it=idx.find(x=>x.id===id);if(it){Object.assign(it,o);await IDB.set("index",idx)}return}
    const all=lsGet("ed.designs",[]);const it=all.find(x=>x.id===id);if(it){Object.assign(it,o);localStorage.setItem("ed.designs",JSON.stringify(all))}},
  async move(id,sec){if(this.kind==="fb"){await FB.m.updateDoc(fbDoc("designs",id),{sec});return}
    if(this.kind==="db"){await this.col().doc(id).update({sec});return}
    if(this.idb){const d=await IDB.get("d:"+id);if(d){d.sec=sec;await IDB.set("d:"+id,d)}const idx=(await IDB.get("index"))||[];const it=idx.find(x=>x.id===id);if(it){it.sec=sec;await IDB.set("index",idx)}return}
    const all=lsGet("ed.designs",[]);const it=all.find(x=>x.id===id);if(it){it.sec=sec;localStorage.setItem("ed.designs",JSON.stringify(all))}},
  async secciones(){if(this.kind==="fb"){const x=await FB.m.getDoc(fbDoc("meta","carpetas"));return x.exists()?(x.data().secs||null):null}
    if(this.kind==="db"){const x=await this.col().doc("carpetas").get();return x.exists?(x.data().secs||null):null}
    if(this.idb)return(await IDB.get("carpetas"))||null;return lsGet("ed.carpetas",null)},
  async setSecciones(secs){if(this.kind==="fb"){await FB.m.setDoc(fbDoc("meta","carpetas"),{secs,updated:Date.now(),by:fbMe().email});return}
    if(this.kind==="db"){await this.col().doc("carpetas").set({secs});return}
    if(this.idb){await IDB.set("carpetas",secs);return}lsSet("ed.carpetas",secs)},
  async del(id){if(this.kind==="fb"){/* goes to the trash for 30 days */const x=await FB.m.getDoc(fbDoc("designs",id));if(x.exists()){const me=fbMe();await FB.m.setDoc(fbDoc("trash",id),Object.assign({},x.data(),{deletedAt:Date.now(),deletedBy:me.email,deletedName:me.name}))}await FB.m.deleteDoc(fbDoc("designs",id));return}
    if(this.kind==="db"){await this.col().doc(id).delete();return}
    if(this.idb){await IDB.del("d:"+id);await IDB.set("index",((await IDB.get("index"))||[]).filter(x=>x.id!==id));return}
    lsSet("ed.designs",lsGet("ed.designs",[]).filter(x=>x.id!==id))},
  async uploads(){if(this.kind==="fb"){const x=await FB.m.getDoc(fbDoc("meta","uploads"));return x.exists()?(x.data().items||[]):[]}
    if(this.kind==="db"){const s=await this.col().doc("subidas").get();return s.exists?(s.data().items||[]):[]}
    if(this.idb)return(await IDB.get("uploads"))||[];return lsGet("ed.uploads",[])},
  async setUploads(items){if(this.kind==="fb"){await FB.m.setDoc(fbDoc("meta","uploads"),{items:items.filter(i=>!String(i.src).startsWith("data:")).slice(0,300).map(i=>({src:i.src,name:i.name||"",at:i.at||0}))});return}
    if(this.kind==="db"){await this.col().doc("subidas").set({items:items.filter(i=>!i.src.startsWith("data:"))});return}
    if(this.idb){await IDB.set("uploads",items);return}lsSet("ed.uploads",items.filter(i=>!i.src.startsWith("data:")))}
};

const FB_V="12.19.0";
const FB={m:null,app:null,auth:null,db:null,user:null};
FB.ready=new Promise(r=>FB.done=r);
const fbDoc=(...p)=>FB.m.doc(FB.db,...p);
const fbDenied=e=>!!e&&(e.code==="permission-denied"||/permission/i.test(e.message||""));
const b64OfBlob=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]||"");r.onerror=rej;r.readAsDataURL(blob)});
function blobOfB64(b64,type){const bin=atob(b64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type})}
async function fbLoad(){const base=`https://www.gstatic.com/firebasejs/${FB_V}/`;const mods=await Promise.all(["firebase-app.js","firebase-auth.js","firebase-firestore.js"].map(f=>import(base+f)));
  const M=FB.m=Object.assign({},...mods);FB.app=M.initializeApp(window.EDITHOR_FIREBASE);FB.auth=M.getAuth(FB.app);
  try{FB.db=M.initializeFirestore(FB.app,{localCache:M.persistentLocalCache({tabManager:M.persistentMultipleTabManager()})})}catch(e){FB.db=M.getFirestore(FB.app)}}
/* pictures live in Firestore as pieces of text (no paid Storage plan needed); a copy stays in this browser for speed */
async function fbPutImage(blob){blob=await shrinkImage(blob);const M=FB.m,id=uid()+uid(),b64=await b64OfBlob(blob),size=700000,n=Math.max(1,Math.ceil(b64.length/size));
  const batch=M.writeBatch(FB.db);batch.set(fbDoc("images",id),{type:blob.type||"image/png",n,bytes:blob.size,at:Date.now()});
  for(let i=0;i<n;i++)batch.set(fbDoc("images",id,"parts",String(i)),{d:b64.slice(i*size,(i+1)*size)});
  await batch.commit();try{await IDB.set("img:fb:"+id,blob)}catch(e){}return"fb:"+id}
async function fbGetImage(id){try{const c=await IDB.get("img:fb:"+id);if(c)return c}catch(e){}
  if(!(await FB.ready))return null;const M=FB.m,meta=await M.getDoc(fbDoc("images",id));if(!meta.exists())return null;const {n,type}=meta.data();
  const parts=await Promise.all(Array.from({length:n},(_,i)=>M.getDoc(fbDoc("images",id,"parts",String(i)))));const b=blobOfB64(parts.map(p=>p.exists()?p.data().d:"").join(""),type);

async function callGemini(prompt,{aspect,imageB64}){

  const req=async(model,withCfg)=>{const parts=[{text:prompt}];if(imageB64)parts.push({inline_data:{mime_type:"image/jpeg",data:imageB64}});
    const gc={responseModalities:["TEXT","IMAGE"]};if(withCfg&&aspect)gc.imageConfig={aspectRatio:aspect};
    let r;try{r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{method:"POST",headers:{"content-type":"application/json","x-goog-api-key":c.gemini},body:JSON.stringify({contents:[{role:"user",parts}],generationConfig:gc})})}
    catch(e){throw{msg:"No se pudo conectar con Gemini. Revisa tu internet."}}
    const j=await r.json().catch(()=>({}));return{r,j}};
  const msgOf=x=>(x.j.error&&x.j.error.message)||"";
  const noModel=x=>!x.r.ok&&(x.r.status===404||/not found|not supported|is not available|unknown model/i.test(msgOf(x)));
  const order=[c.gemModel,...GEM_MODELS.map(m=>m[0])].filter((m,i,a)=>m&&a.indexOf(m)===i);
  let x,model;for(model of order){x=await req(model,!imageB64);
    if(!x.r.ok&&x.r.status===400&&/imageConfig|aspect/i.test(msgOf(x)))x=await req(model,false);
    if(!noModel(x))break}
  if(model!==c.gemModel&&x.r.ok){c.gemModel=model;aiSave(c)}
  const {r,j}=x,m=msgOf(x);
  if(!r.ok)throw{msg:r.status===400&&/API key|API_KEY/i.test(m)||r.status===403?"La clave de Gemini no es válida o no tiene permiso. Revísala en «Configurar claves».":r.status===429||/quota|RESOURCE_EXHAUSTED|billing/i.test(m)?"Tu cuenta de Gemini no tiene cuota para imágenes. Los modelos de imagen de Gemini no tienen nivel gratis en la API: activa la facturación en aistudio.google.com → Billing, o usa OpenAI.":noModel(x)?"Ningún modelo de imágenes de Gemini está disponible en tu cuenta.":"Gemini respondió con un error: "+(m||r.status)};
  const cand=(j.candidates||[])[0];const parts=(cand&&cand.content&&cand.content.parts)||[];
  const imgp=parts.find(p=>p.inlineData||p.inline_data);
  if(!imgp){const why=(j.promptFeedback&&j.promptFeedback.blockReason)||(cand&&cand.finishReason)||"";const said=parts.filter(p=>p.text).map(p=>p.text).join(" ").trim();
    throw{msg:/SAFETY|PROHIBITED|BLOCK/i.test(why)?"Gemini rechazó la imagen por sus reglas de contenido. Cambia un poco el pedido y vuelve a intentar.":said?"Gemini respondió sin imagen: «"+said.slice(0,220)+"». Prueba de nuevo o reformula el pedido.":"Gemini no devolvió ninguna imagen. Vuelve a intentar."}}
  const d=imgp.inlineData||imgp.inline_data;return{b64:d.data,mime:d.mimeType||d.mime_type||"image/png",model}}

      setStatus("Quitando el fondo con OpenAI…");const im=await layerJpeg(L,1536);

    const src=await keepImage(out);await ld(src);
    if(S.doc.layers.includes(L)){L.src=src;commit();renderProps();requestRender()}
    UPS.unshift({src,name:"Sin fondo · "+(L.name||"imagen"),at:Date.now()});try{await store.setUploads(UPS.slice(0,200))}catch(e){}

function bindSw(id,fn,rerender){const box=document.querySelector(`[data-sw="${id}"]`);if(!box)return;
  box.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{fn(b.dataset.c);commit();renderProps();requestRender()});
  const cc=box.querySelector("[data-cc]");if(cc){cc.addEventListener("input",e=>{fn(e.target.value.toUpperCase());requestRender()});cc.addEventListener("change",()=>{commit();renderProps()})}}
function setThick(L,v){v=Math.max(.5,Math.round((+v||1)*2)/2);if(L.w>=L.h){const cy=L.y+L.h/2;L.h=v;L.y=Math.round((cy-v/2)*2)/2}else{const cx=L.x+L.w/2;L.w=v;L.x=Math.round((cx-v/2)*2)/2}}
function syncGeom(){const L=selL();if(!L)return;["x","y","w"].forEach(k=>{const i=$("#p-"+k);if(i&&document.activeElement!==i)i.value=round(L[k])});const hI=$("#p-h");if(hI&&document.activeElement!==hI)hI.value=round(L.h)}
const KIND={text:"Texto",img:"Imagen",rect:"Forma",ellipse:"Círculo",n:"La N",iso:"Isotipo",qr:"QR",dev:"Mockup"};
const fullPanels=()=>!isCompact();
function layersHtml(){return fullPanels()?layersBlock():""}
function layersBlock(){const a=S.doc.layers;return `<h3>Capas (${a.length})</h3><p class="hint" style="margin-top:-4px">Shift + clic para elegir varias.</p><div class="layers">${a.slice().reverse().map(L=>`<div class="layer${selIds().includes(L.id)?" on":""}${L.hide?" off":""}" data-id="${L.id}"><span class="kind">${L.g?"▣ ":""}${KIND[L.t]||""}</span><span class="nm">${esc(L.t==="text"?String(L.txt).split("\n")[0]||L.name:L.name||"")}</span><button type="button" data-hide="${L.id}" aria-label="${L.hide?"Mostrar":"Ocultar"}">${L.hide?ICON.eyeoff:ICON.eye}</button><button type="button" data-lock="${L.id}" aria-label="${L.lock?"Desbloquear":"Bloquear"}">${L.lock?ICON.lock:ICON.unlock}</button></div>`).join("")}</div>`}
function bindLayers(){document.querySelectorAll(".layer").forEach(r=>r.addEventListener("click",e=>{if(e.target.closest("button"))return;const id=r.dataset.id;
    if(e.shiftKey||e.metaKey||e.ctrlKey){const cur=selIds();setSel(cur.includes(id)?cur.filter(x=>x!==id):[...cur,id],id)}else setSel([id])}));
  document.querySelectorAll("[data-hide]").forEach(b=>b.onclick=()=>{const L=S.doc.layers.find(l=>l.id===b.dataset.hide);L.hide=!L.hide;commit();renderProps();requestRender()});
  document.querySelectorAll("[data-lock]").forEach(b=>b.onclick=()=>{const L=S.doc.layers.find(l=>l.id===b.dataset.lock);L.lock=!L.lock;commit();renderProps();requestRender()})}

function openDoc(d,fresh){if(S.dirty)saveNow();normDoc(d);setLock(false);S.doc=d;S.sel=null;S.multi=[];S.crop=null;S.zoom=1;S.panX=0;S.panY=0;S.dirty=false;if(d.brand&&d.brand!==S.brand)setBrand(d.brand,true);

let JSPDF=null;
function loadJsPDF(){return JSPDF||(JSPDF=new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf.jsPDF);const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";sc.onload=()=>res(window.jspdf.jsPDF);sc.onerror=()=>{JSPDF=null;rej()};document.head.appendChild(sc)}))}
function pageCanvas(d,P,k,noBg){const c=document.createElement("canvas");c.width=Math.round(d.w*k);c.height=Math.round(d.h*k);const x=c.getContext("2d");x.scale(k,k);drawDesign(x,{w:d.w,h:d.h,bg:P.bg,layers:P.layers},null,noBg);return c}
/* files for some pages of a design: images give one file per page, PDF and PowerPoint one file with those pages */
async function buildFiles(d,fmt,pages){const all=d.pages.map((_,i)=>i);if(!pages||!pages.length)pages=(fmt==="pdf"||fmt==="pptx")?all:[d.pi||0];
  pages=pages.filter(i=>i>=0&&i<d.pages.length);if(!pages.length)pages=[0];
  await Promise.all(pages.flatMap(i=>d.pages[i].layers).filter(l=>l.src).map(l=>ld(l.src)));await fontsReady;
  const base=(d.name||"diseno").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"diseno";
  const multi=d.pages.length>1,sufx=i=>multi?"-pagina-"+(i+1):"",out=[];
  if(fmt==="pdf"){setStatus("Preparando el PDF…");let J;try{J=await loadJsPDF()}catch(e){setStatus("");toast("No se pudo cargar la herramienta de PDF. Revisa tu internet.");return null}
    const k=d.mm?Math.min(2,4000/Math.max(d.w,d.h)):1;const W=d.mm?d.mm[0]:d.w*.75,H=d.mm?d.mm[1]:d.h*.75,unit=d.mm?"mm":"pt";
    const pdf=new J({orientation:W>H?"landscape":"portrait",unit,format:[W,H],compress:true});
    pages.forEach((pi,n)=>{if(n)pdf.addPage([W,H],W>H?"landscape":"portrait");pdf.addImage(pageCanvas(d,d.pages[pi],k).toDataURL("image/jpeg",.92),"JPEG",0,0,W,H,undefined,"FAST")});
    out.push({blob:pdf.output("blob"),fname:base+(multi&&pages.length<d.pages.length?(pages.length===1?sufx(pages[0]):"-paginas-"+pages.map(i=>i+1).join("-")):"")+".pdf"});setStatus("");return out}
  if(fmt==="pptx"){setStatus("Preparando el PowerPoint…");try{const dd=Object.assign({},d,{pages:pages.map(i=>d.pages[i]),pi:0});out.push({blob:await toPPTX(dd),fname:base+".pptx"})}catch(e){console.error(e);setStatus("");toast("No se pudo preparar el PowerPoint. Revisa tu internet.");return null}setStatus("");return out}
  for(const pi of pages){const P=d.pages[pi];
    if(fmt==="svg"){setStatus("Preparando el SVG…");out.push({blob:new Blob([await toSVG(P.layers,{x:0,y:0,w:d.w,h:d.h},P.bg)],{type:"image/svg+xml"}),fname:base+sufx(pi)+".svg"});setStatus("")}
    else if(fmt==="pngt"){const c=pageCanvas(d,P,1,true);out.push({blob:await new Promise(r=>c.toBlob(r,"image/png")),fname:base+sufx(pi)+"-sin-fondo.png"})}
    else{const c=pageCanvas(d,P,1),type=fmt==="jpg"?"image/jpeg":"image/png";let b;try{b=await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(),type,.92))}catch(e){toast("No se pudo preparar la imagen.");return null}out.push({blob:b,fname:base+sufx(pi)+"."+fmt})}}
  return out}
async function buildExport(d,fmt,pages){const files=await buildFiles(d,fmt,pages);if(!files||!files.length)return null;if(files.length===1)return files[0];
  let Z;try{Z=await loadZip()}catch(e){toast("No se pudo cargar la herramienta para comprimir. Revisa tu internet.");return null}
  const zip=new Z();files.forEach(f=>zip.file(f.fname,f.blob));setStatus("Comprimiendo…");const blob=await zip.generateAsync({type:"blob"});setStatus("");
  return{blob,fname:files[0].fname.replace(/-pagina-\d+(-sin-fondo)?\.[a-z]+$/i,"")+"-"+files.length+"-paginas.zip"}}
const PG_FMT_N={png:"PNG",jpg:"JPG",pngt:"PNG sin fondo",svg:"SVG",pdf:"PDF",pptx:"PowerPoint"};
/* asks which pages to download (all or some); one page designs skip the question */
function downloadDesign(d,o){o=o||{};const n=d.pages.length,fixed=!!o.fmt;
  if(fixed&&n<=1)return(async()=>{const r=await buildExport(d,o.fmt,[0]);if(r)await saveBlob(r.blob,r.fname,o.fmt)})();
  let fmt=o.fmt||"png";const sel=new Set(o.cur!=null&&!["pdf","pptx"].includes(fmt)?[o.cur]:d.pages.map((_,i)=>i));
  const v=showDialog("Descargar «"+(d.name||"Diseño")+"»",`${fixed?"":`<div class="f"><span>Formato</span><div class="chips dlfmt">${["png","jpg","pdf","svg","pptx"].map(k=>`<button type="button" data-df="${k}" aria-pressed="${k===fmt}">${PG_FMT_N[k]}</button>`).join("")}</div></div>`}
    ${n>1?`<div class="f" style="margin-top:12px"><span>Páginas · el diseño tiene ${n}</span><div class="chips"><button type="button" id="dp-all">Todas</button><button type="button" id="dp-none">Ninguna</button></div><div class="dpages" id="dp-grid">${d.pages.map((P,i)=>`<label class="dpg"><input type="checkbox" data-pg="${i}"${sel.has(i)?" checked":""}><span class="dpic" data-pc="${i}"></span><small>Página ${i+1}${P.name?" · "+esc(P.name):""}</small></label>`).join("")}</div></div>`:""}
    <p class="hint" id="dp-note" style="min-height:1.2em"></p>
    <div class="row-end"><button class="btn" type="button" data-close>Cancelar</button><button class="btn pri" type="button" id="dp-go">Descargar</button></div>`);
  v.querySelector(".dlg").style.width="min(640px,100%)";
  const note=()=>{const k=sel.size,img=!["pdf","pptx"].includes(fmt);v.querySelector("#dp-note").textContent=!k?"Elige al menos una página.":n<=1?"":img?(k>1?`Se descargan ${k} imágenes juntas en un archivo ZIP.`:"Se descarga una imagen."):`Un solo ${PG_FMT_N[fmt]} con ${k===n?"todas las páginas":k+" página"+(k>1?"s":"")}.`;v.querySelector("#dp-go").disabled=!k};
  v.querySelectorAll("[data-df]").forEach(b=>b.onclick=()=>{fmt=b.dataset.df;v.querySelectorAll("[data-df]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));note()});
  v.querySelectorAll("[data-pg]").forEach(c=>c.onchange=()=>{c.checked?sel.add(+c.dataset.pg):sel.delete(+c.dataset.pg);note()});
  const setAll=on=>{v.querySelectorAll("[data-pg]").forEach(c=>{c.checked=on;on?sel.add(+c.dataset.pg):sel.delete(+c.dataset.pg)});note()};
  v.querySelector("#dp-all")?.addEventListener("click",()=>setAll(true));v.querySelector("#dp-none")?.addEventListener("click",()=>setAll(false));
  (async()=>{await Promise.all(d.pages.flatMap(P=>P.layers).filter(l=>l.src).map(l=>ld(l.src)));v.querySelectorAll("[data-pc]").forEach(el=>{const i=+el.dataset.pc,k=140/Math.max(d.w,d.h),c=pageCanvas(d,d.pages[i],k);el.appendChild(c)})})();
  note();
  v.querySelector("#dp-go").onclick=async()=>{const b=v.querySelector("#dp-go");b.disabled=true;b.textContent="Preparando…";const pages=[...sel].sort((a,b)=>a-b);
    const r=await buildExport(d,fmt,pages);v.remove();if(r)await saveBlob(r.blob,r.fname,r.fname.endsWith(".zip")?"zip":fmt)}}
async function saveBlob(blob,fname,fmt){fmt=fmt||fname.split('.').pop();
  if(store.downloads){try{await store.downloads.save({filename:fname,data:blob});toast(fmt==="pdf"?"PDF descargado":"Archivo descargado");return}catch(e){if(e&&e.code==="declined")return;if(e&&e.code==="rate_limited"){toast("Ya hay una descarga esperando tu confirmación.");return}}}
  const url=URL.createObjectURL(blob);
  if(!window.claude||fmt==="pdf"||fmt.includes("svg")){const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();toast(fmt==="pdf"?"PDF descargado":"Archivo descargado");return}
  showDialog("Tu imagen",`<p class="hint" style="text-align:center;margin-bottom:12px">Para guardarla: clic derecho sobre la imagen → «Guardar imagen como…». En el celular, mantén el dedo sobre ella.</p><img class="preview-img" src="${url}" alt="Diseño listo para guardar">`);
}
async function exportImg(fmt){
  if(S.editing)endEdit();
  if(!fmt.startsWith("sel-")&&S.doc.pages.length>1){syncPage();downloadDesign(S.doc,{fmt,cur:S.doc.pi||0});return}
  const d=S.doc;syncPage();await Promise.all(d.pages.flatMap(P=>P.layers).filter(l=>l.t==="img").map(l=>ld(l.src)));await fontsReady;
  const base=(d.name||"diseno").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"diseno";
  let blob,fname;
  if(fmt==="sel-png"||fmt==="sel-svg"){const Ls=selLayers().filter(l=>!l.hide);if(!Ls.length){toast("Primero elige uno o más elementos del diseño.");return}
    await Promise.all(Ls.filter(l=>l.src).map(l=>ld(l.src)));const b=bbox(Ls),nm=Ls.length===1?(Ls[0].name||"elemento"):"seleccion";
    const slug=String(nm).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/gi,"-").replace(/^-|-$/g,"").toLowerCase()||"seleccion";
    if(fmt==="sel-png"){const k=Math.min(3,Math.max(1,2),4000/Math.max(b.w,b.h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(b.w*k));c.height=Math.max(1,Math.round(b.h*k));const x=c.getContext("2d");x.scale(k,k);x.translate(-b.x,-b.y);for(const L of Ls)drawLayer(x,L,null);
      blob=await new Promise(r=>c.toBlob(r,"image/png"));fname=base+"-"+slug+".png"}
    else{setStatus("Preparando el SVG…");blob=new Blob([await toSVG(Ls,b,null)],{type:"image/svg+xml"});fname=base+"-"+slug+".svg";setStatus("")}}
  else{const r=await buildExport(d,fmt);if(!r)return;blob=r.blob;fname=r.fname}
  await saveBlob(blob,fname,fmt);
}

/* ================== copiar el diseño a otros tamaños ================== */
/* Each chosen size becomes a NEW design (its own file) with the same content, re-arranged:
   backgrounds and full-width bands stretch to the new canvas; everything else keeps its size ratio
   and stays near the same edge (top/bottom, left/right) or in the middle. */
function adaptLayers(layers,W,H,W2,H2){const s=Math.min(W2/W,H2/H),out=clone(layers.map(stripL)),units=[],seen=new Set();

const VER_EVERY=30*60e3,VER_FIRST=10*60e3,VER_KEEP=25;

  if(!S.verAt[d.id]&&!d.verAt){S.verAt[d.id]=now;return}
  if(now-last>VER_EVERY){S.verAt[d.id]=now;await addVersion(d.id,Object.assign({},rec,{thumb:d.thumb}),"Copia automática")}}

  for(const x of q.docs){const v=x.data();if(now-(v.deletedAt||0)>TRASH_DAYS*864e5){purgeTrash(x.id).catch(()=>{});continue}out.push(Object.assign({id:x.id},v))}
  out.sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));CX.trash=out;CX.trashN=out.length;return out}

/* ---------- cloud space (Firestore free plan: 1 GB) ---------- */
const SPACE={val:null,busy:false},SPACE_MAX=1024*1024*1024;
async function paintSpace(){const el=$("#cx-space");if(!el)return;
  if(SPACE.val==null&&!SPACE.busy){SPACE.busy=true;el.innerHTML='<span class="hint">Calculando el espacio…</span>';
    try{const q=await FB.m.getDocs(FB.m.collection(FB.db,"images"));let b=0;q.docs.forEach(x=>{b+=(x.data().bytes||0)*1.37});b+=(CX.list||[]).reduce((s,d)=>s+(d._sz||0),0);b+=(CX.trash||[]).reduce((s,d)=>s+((d.data||"").length+(d.thumb||"").length),0);SPACE.val=b}catch(e){SPACE.val=-1}
    SPACE.busy=false;const e2=$("#cx-space");if(e2)paintSpace();return}
  if(SPACE.val<0){el.innerHTML="";return}
  const p=Math.min(100,SPACE.val/SPACE_MAX*100),mb=SPACE.val/1048576,lvl=p>=90?"full":p>=70?"warn":"";
  el.innerHTML=`<div class="spbar ${lvl}"><i style="width:${Math.max(1,p).toFixed(1)}%"></i></div><small>Espacio en la nube: <b>${mb<1024?Math.round(mb)+" MB":(mb/1024).toFixed(2)+" GB"}</b> de 1 GB (aprox.)${lvl==="full"?" · <b>casi lleno</b>: vacía la papelera o elimina imágenes que no uses.":lvl==="warn"?" · se está llenando.":""}</small>`}
/* pictures are made lighter before they go to the cloud: up to 2560 px, WebP (JPG on Safari) */
async function shrinkImage(blob){try{if(!blob||!/^image\/(png|jpeg|webp)$/.test(blob.type)||blob.size<350000)return blob;
  const bmp=await createImageBitmap(blob),M=2560,sc=Math.min(1,M/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);bmp.close&&bmp.close();
  const enc=(t,q)=>new Promise(r=>c.toBlob(r,t,q));let out=await enc("image/webp",.88);
  if(!out||out.type!=="image/webp")out=blob.type==="image/jpeg"?await enc("image/jpeg",.88):await enc("image/png");
  return out&&out.size<blob.size?out:blob}catch(e){return blob}}

  contax:{whatsapp:"+591 690-21969",web:"contaxbolivia.com",email:"info@contaxbolivia.com",direccion:"Cond. Los Ángeles Casa 181 · Santa Cruz",horario:"lunes a viernes de 8:30 a 18:30 y los sábados de 9:00 a 13:00"}};
const BINFO_F=[["whatsapp","WhatsApp","+591 690-21969"],["web","Página web","nummeros.contaxbolivia.com"],["email","Correo","info@contaxbolivia.com"],["direccion","Dirección","Calle, número · Ciudad"],["horario","Horario de atención","lunes a viernes de 8:30 a 18:30"]];
let BINFO=clone(BINFO_DEF);
async function loadBrandInfo(){let v=null;
  if(store.kind==="fb"){try{const x=await FB.m.getDoc(fbDoc("meta","marcas"));if(x.exists())v=x.data()}catch(e){}}else v=lsGet("ed.marcas",null);
  for(const b of ["nummeros","contax"])BINFO[b]=Object.assign({},BINFO_DEF[b],(v&&v[b])||{});return BINFO}
const escRe=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const waDigits=s=>String(s||"").replace(/\D/g,"");
function brandSubs(from,to){const out=[];const add=(a,b)=>{if(a&&b&&a!==b)out.push([new RegExp(escRe(a),"g"),b.replace(/\$/g,"$$$$")])};
  add(from.email,to.email);add(from.direccion,to.direccion);add(from.horario,to.horario);add(from.whatsapp,to.whatsapp);
  if(from.web&&to.web&&from.web!==to.web)out.push([new RegExp("(^|[^\\w.@-])"+escRe(from.web)+"(?![\\w.-]*\\w)","g"),"$1"+to.web.replace(/\$/g,"$$$$")]);return out}
function applySubs(doc,from,to){const T=brandSubs(from,to),dA=waDigits(from.whatsapp),dB=waDigits(to.whatsapp);if(!T.length&&dA===dB)return false;let ch=false;
  for(const P of doc.pages||[{layers:doc.layers||[]}])for(const L of P.layers||[]){
    if(L.t==="text"&&typeof L.txt==="string"){let t=L.txt;for(const [re,v] of T)t=t.replace(re,v);if(t!==L.txt){L.txt=t;try{layoutText(L)}catch(e){}ch=true}}
    if(L.t==="qr"&&typeof L.data==="string"){let t=L.data;for(const [re,v] of T)t=t.replace(re,v);if(dA&&dB&&dA!==dB)t=t.split(dA).join(dB);if(t!==L.data){L.data=t;L.qr=null;ch=true}}}
  return ch}
function applyBrandInfo(d){const b=d&&d.brand;if(!BINFO_DEF[b])return d;applySubs(d,BINFO_DEF[b],BINFO[b]);return d}
function brandInfoDialog(){let cur="nummeros";const draft=clone(BINFO);
  const v=showDialog("Datos de las marcas",`<p class="hint" style="margin-top:0">Las plantillas nuevas se llenan solas con estos datos. ${store.kind==="fb"?"Se guardan en la nube para todo el equipo.":"Se guardan en este navegador."}</p>

    v.querySelectorAll("[data-bk]").forEach(i=>i.oninput=()=>{draft[cur][i.dataset.bk]=i.value.trim()})};
  v.querySelectorAll("[data-bi]").forEach(b=>b.onclick=()=>{cur=b.dataset.bi;v.querySelectorAll("[data-bi]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));paintF()});paintF();
  v.querySelector("#bi-save").onclick=async()=>{const btn=v.querySelector("#bi-save"),msg=v.querySelector("#bi-msg"),old=clone(BINFO);btn.disabled=true;
    for(const b of ["nummeros","contax"])for(const [k] of BINFO_F)if(!draft[b][k])draft[b][k]=old[b][k];
    try{if(store.kind==="fb")await FB.m.setDoc(fbDoc("meta","marcas"),Object.assign({},draft,{updated:Date.now(),by:fbMe().email}));else lsSet("ed.marcas",draft)}catch(e){btn.disabled=false;msg.textContent="No se pudo guardar. Revisa tu conexión.";return}
    BINFO=clone(draft);let n=0;
    if(v.querySelector("#bi-upd").checked){let list=[];try{list=await store.list()}catch(e){}const todo=list.filter(d=>BINFO_DEF[d.brand]);let i=0;
      for(const it of todo){i++;msg.textContent=`Revisando diseños guardados… ${i} de ${todo.length}`;let d=null;try{d=await store.get(it.id)}catch(e){}if(!d)continue;
        if(applySubs(d,old[d.brand],BINFO[d.brand])){try{await store.put(Object.assign({},d,{id:it.id}));n++}catch(e){}}}
      if(S.doc&&BINFO_DEF[S.doc.brand]){if(S.locked&&S.doc.by){const id=S.doc.id;S.dirty=false;await openStored(id)}else if(applySubs(S.doc,old[S.doc.brand],BINFO[S.doc.brand])){commit();requestRender()}}}
    v.remove();HOME.list=null;toast(n?`Datos guardados · se actualizaron ${n} diseño${n===1?"":"s"}`:"Datos guardados");if(S.tab==="plantillas")renderLib()}}

/* ---------- AI spending: how many images and texts each person used this month, with an optional cap ---------- */
const monthKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const userKey=e=>String(e||"").toLowerCase().replace(/\./g,",");
async function usageAdd(kind){if(store.kind!=="fb"||!FB.user||!FB.m.increment)return;const me=fbMe();try{await FB.m.setDoc(fbDoc("usage",monthKey()),{[userKey(me.email)]:{[kind]:FB.m.increment(1),name:me.name,email:me.email}},{merge:true})}catch(e){}}
async function usageState(){const r={lim:0,mine:0,rows:[]};if(store.kind!=="fb"||!FB.user)return r;
  try{const [u,l]=await Promise.all([FB.m.getDoc(fbDoc("usage",monthKey())),FB.m.getDoc(fbDoc("meta","ialimit"))]);r.lim=l.exists()?+(l.data().img||0):0;const all=u.exists()?u.data():{};
    r.rows=Object.values(all).filter(x=>x&&typeof x==="object").map(x=>({email:x.email||"",name:x.name||"",img:+(x.img||0),txt:+(x.txt||0)})).sort((a,b)=>b.img-a.img);
    const m=all[userKey(fbMe().email)];r.mine=m?+(m.img||0):0}catch(e){}return r}
{const _ri=runImage;runImage=async function(prov,prompt,image){const u=await usageState();if(u.lim&&u.mine>=u.lim)throw{msg:`Llegaste al tope de ${u.lim} imágenes de IA de este mes. Se puede cambiar en IA → Configurar claves → Uso de este mes.`};const r=await _ri(prov,prompt,image);usageAdd("img");return r}}

async function paintUsage(box){if(!box||store.kind!=="fb")return;box.innerHTML='<p class="hint">Cargando el uso de este mes…</p>';const u=await usageState();if(!box.isConnected)return;

    <label class="f" style="margin-top:10px"><span>Tope de imágenes por persona al mes (0 = sin tope)</span><div style="display:flex;gap:8px"><input type="number" id="u-lim" min="0" step="1" value="${u.lim}" style="max-width:120px"><button class="btn" type="button" id="u-save">Guardar tope</button></div><small class="k">Cada imagen cuesta unos centavos de dólar; los textos de Claude salen de tus créditos mensuales.</small></label>`;
